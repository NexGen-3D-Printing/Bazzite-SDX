title: NexGen3D SDX Portal
screens:
- title: Setup
  description: Bazzite-SDX links and bulk installs
  actions:
  - id: Bazzite-SDX-readme
    title: Open Bazzite-SDX on GitHub
    description: Project page for Bazzite-SDX (Bazzite-DX + Linux Surface kernel), including source, issues, and documentation.
    default: false
    script: xdg-open https://github.com/NexGen-3D-Printing/Bazzite-SDX
  - id: Bazzite-SDX-release
    title: Open latest release notes
    description: View the auto-updated latest release for base OS/Surface kernel info and Bazzite-SDX app install instructions.
    default: false
    script: xdg-open https://github.com/NexGen-3D-Printing/Bazzite-SDX/releases/tag/latest
  - id: install-all-bazzite-sdx-flatpaks
    title: Install core Bazzite-SDX apps (all)
    description: Installs the core set of recommended Bazzite-SDX apps (Brave, OpenCode, Mission Center, SolidCraft, and ArtCraft).
    default: false
    script: ujust install-bazzite-sdx-flatpaks; status=$?; echo; echo "Press Enter to close..."; read -r _; exit $status
- title: AI Tools
  description: AI apps, coding tools, local LLMs, and AI workspaces
  actions:
  - id: install-sdx-opencode
    title: OpenCode (desktop app)
    description: Open source AI coding agent for writing, editing, and running code with AI-assisted workflows.
    default: false
    status_script: "_gl_json=\"$(flatpak run --command=gearlever it.mijorus.gearlever --list-installed --json 2>/dev/null || true)\"; printf '%s' \"$_gl_json\" | python3 -c \"import json,sys,re; d=json.loads(sys.stdin.read() or '{}'); items=d.get('installed',[]); it=next((i for i in items if 'opencode' in ((i.get('name') or '').lower()+' '+(i.get('path') or '').lower())), None); \nif not it: print('uninstall')\nelse:\n v=(it.get('current_version') or '').lower(); print('beta' if re.search(r'(alpha|beta|rc|pre|dev)', v) else 'install')\""
    options:
    - id: install
      label: Install / Reinstall (stable)
      script: ujust install-sdx-opencode stable; status=$?; echo; echo "Press Enter to close..."; read -r _; exit $status
    - id: install-prerelease
      label: Install pre-release/beta (if available)
      script: ujust install-sdx-opencode prerelease; status=$?; echo; echo "Press Enter to close..."; read -r _; exit $status
  - id: install-sdx-opencode-cli
    title: OpenCode CLI
    description: Command-line interface for OpenCode, for using the AI coding agent from your terminal.
    default: false
    status_script: command -v opencode >/dev/null 2>&1 || [ -x "$HOME/.opencode/bin/opencode" ] && echo install || echo uninstall
    options:
    - id: install
      label: Install / Reinstall
      script: ujust install-sdx-opencode-cli; status=$?; echo; echo "Press Enter to close..."; read -r _; exit $status
  - id: install-sdx-lm-studio
    title: LM Studio
    description: Desktop app for discovering, downloading, and running local LLMs with chat and local API workflows.
    default: false
    status_script: flatpak --user info ai.lmstudio.lm-studio >/dev/null 2>&1 && echo install || echo uninstall
    options:
    - id: install
      label: Install / Reinstall
      script: ujust install-sdx-lm-studio; status=$?; echo; echo "Press Enter to close..."; read -r _; exit $status
  - id: install-sdx-unsloth-desktop
    title: Unsloth Desktop
    description: Desktop app for running and training AI models locally with Unsloth.
    default: false
    status_script: if [ -f "$HOME/Applications/Unsloth-Desktop-Linux.AppImage" ]; then if [ "$(cat "$HOME/.config/bazzite-sdx/release-channel/install-sdx-unsloth-desktop" 2>/dev/null)" = "prerelease" ]; then echo beta; else echo install; fi; else echo uninstall; fi
    options:
    - id: install
      label: Install / Reinstall (stable)
      script: ujust install-sdx-unsloth-desktop stable; status=$?; echo; echo "Press Enter to close..."; read -r _; exit $status
    - id: install-prerelease
      label: Install pre-release/beta (if available)
      script: ujust install-sdx-unsloth-desktop prerelease; status=$?; echo; echo "Press Enter to close..."; read -r _; exit $status
  - id: install-sdx-artcraft
    title: ArtCraft
    description: 'Warning: ArtCraft requires an account and may require a subscription for some features/services. Creative engine for artists, designers, and filmmakers.'
    default: false
    status_script: if flatpak --user list --app --columns=application 2>/dev/null | grep -iq "artcraft"; then if [ "$(cat "$HOME/.config/bazzite-sdx/release-channel/install-sdx-artcraft" 2>/dev/null)" = "prerelease" ]; then echo beta; else echo install; fi; else echo uninstall; fi
    options:
    - id: install
      label: Install / Reinstall (stable)
      script: ujust install-sdx-artcraft stable; status=$?; echo; echo "Press Enter to close..."; read -r _; exit $status
    - id: install-prerelease
      label: Install pre-release/beta (if available)
      script: ujust install-sdx-artcraft prerelease; status=$?; echo; echo "Press Enter to close..."; read -r _; exit $status
  - id: install-sdx-craft-anything
    title: Craft Anything
    description: Tool for exploring how software works and building or crafting software workflows.
    default: false
    status_script: if flatpak --user info ai.storyteller.craft-anything >/dev/null 2>&1; then if [ "$(cat "$HOME/.config/bazzite-sdx/release-channel/install-sdx-craft-anything" 2>/dev/null)" = "prerelease" ]; then echo beta; else echo install; fi; else echo uninstall; fi
    options:
    - id: install
      label: Install / Reinstall (stable)
      script: ujust install-sdx-craft-anything stable; status=$?; echo; echo "Press Enter to close..."; read -r _; exit $status
    - id: install-prerelease
      label: Install pre-release/beta (if available)
      script: ujust install-sdx-craft-anything prerelease; status=$?; echo; echo "Press Enter to close..."; read -r _; exit $status
  - id: install-sdx-rea
    title: REA (morluto/rea)
    description: CLI/MCP toolkit that helps coding agents reverse engineer software and binaries with evidence-oriented workflows.
    default: false
    status_script: command -v rea >/dev/null 2>&1 && echo install || echo uninstall
    options:
