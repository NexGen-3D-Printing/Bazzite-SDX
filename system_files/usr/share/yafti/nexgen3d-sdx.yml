title: NexGen3D SDX Portal
screens:
  - title: "Setup"
    description: "Bazzite-SDX links and bulk installs"
    actions:
      - id: "bazzite-sdx-readme"
        title: "Open Bazzite-SDX on GitHub"
        description: "Project page for Bazzite-SDX (Bazzite-DX + Linux Surface kernel), including source, issues, and documentation."
        default: false
        script: "xdg-open https://github.com/NexGen-3D-Printing/bazzite-sdx"
      - id: "bazzite-sdx-release"
        title: "Open latest release notes"
        description: "View the auto-updated latest release for base OS/Surface kernel info and Bazzite-SDX app install instructions."
        default: false
        script: "xdg-open https://github.com/NexGen-3D-Printing/bazzite-sdx/releases/tag/latest"
      - id: "install-all-bazzite-sdx-flatpaks"
        title: "Install core Bazzite-SDX Flatpak apps (all)"
        description: "Installs the core curated set in one run (Bazzite-style; not baked into the OS image): Brave Browser, OpenCode app, Mission Center, SolidCraft, and ArtCraft. Installs as user Flatpaks (per-user, no sudo required). Requires network access."
        default: false
        script: 'ujust install-bazzite-sdx-flatpaks; status=$?; echo; echo "Press Enter to close..."; read -r _; exit $status'

  - title: "AI Tools"
    description: "AI apps, coding tools, local LLMs, and AI workspaces"
    actions:
      - id: "install-sdx-opencode"
        title: "OpenCode (app)"
        description: "OpenCode is an open source AI coding agent that helps you write and run code with AI models, supporting agentic coding workflows (prompts, edits, and command execution). Install method (priority): Flatpak (preferred). Installs user Flatpak ai.opencode.opencode from Flathub. Source: https://github.com/anomalyco/opencode | Flathub: https://flathub.org/en/apps/ai.opencode.opencode"
        default: false
        script: 'ujust install-sdx-opencode; status=$?; echo; echo "Press Enter to close..."; read -r _; exit $status'
      - id: "install-sdx-opencode-cli"
        title: "OpenCode CLI"
        description: "Installs the OpenCode command-line interface using the official OpenCode v2 install script. Install method (priority): no official standalone CLI Flatpak/AppImage package used here; installs the official CLI to your user directory (typically ~/.opencode/bin) without rpm-ostree layering. After install, ensure the bin directory is on your PATH per installer output. Requires network access. Source: https://opencode.ai/ | https://github.com/anomalyco/opencode"
        default: false
        script: 'ujust install-sdx-opencode-cli; status=$?; echo; echo "Press Enter to close..."; read -r _; exit $status'
      - id: "install-sdx-lm-studio"
        title: "LM Studio"
        description: "LM Studio is a desktop app for discovering, downloading, and running local LLMs, with chat and local server/API workflows. Install method (priority): Flatpak (preferred). Installs user Flatpak ai.lmstudio.lm-studio from Flathub (the Flathub package uses LM Studio's Linux AppImage as its upstream payload). Requires network access; model downloads are managed inside the app. Source: https://lmstudio.ai/ | https://github.com/flathub/ai.lmstudio.lm-studio"
        default: false
        script: 'ujust install-sdx-lm-studio; status=$?; echo; echo "Press Enter to close..."; read -r _; exit $status'
      - id: "install-sdx-unsloth-desktop"
        title: "Unsloth Desktop"
        description: "Unsloth Desktop is the official Unsloth local app for running and training models (chat, model workflows, and training features as provided by Unsloth). Install method (priority): no official Flatpak; AppImage (preferred over rpm-ostree layer). Downloads the latest Unsloth-Desktop-Linux.AppImage from GitHub releases to ~/Applications and creates a convenience symlink at ~/.local/bin/unsloth-desktop. Tip: use Gear Lever (System Utilities) to integrate/manage the AppImage. Requires network access. Source: https://unsloth.ai/ | https://github.com/unslothai/unsloth"
        default: false
        script: 'ujust install-sdx-unsloth-desktop; status=$?; echo; echo "Press Enter to close..."; read -r _; exit $status'
      - id: "install-sdx-artcraft"
        title: "ArtCraft"
        description: "**Warning:** ArtCraft requires an account and may require a subscription for some features/services (check current ArtCraft terms). ArtCraft (storytold/artcraft) is an intentional crafting engine for artists, designers, and filmmakers, supporting creative production workflows. Install method (priority): upstream Flatpak bundle (Flatpak-format delivery). Downloads and installs the latest Linux x86_64 .flatpak bundle from GitHub releases at install time. Requires network access and may take time due to bundle/runtimes. Source: https://github.com/storytold/artcraft | Website: https://getartcraft.com/"
        default: false
        script: 'ujust install-sdx-artcraft; status=$?; echo; echo "Press Enter to close..."; read -r _; exit $status'
      - id: "install-sdx-craft-anything"
        title: "Craft Anything"
        description: "Craft Anything (storytold/craft-anything) helps you explore how software works and craft/build software workflows (including agent-assisted exploration/build features, as provided upstream). Install method (priority): upstream Flatpak bundle (preferred over AppImage/rpm-ostree). Downloads and installs the latest Linux x86_64 .flatpak bundle from GitHub releases at install time. Requires network access and may take time due to bundle/runtimes. Source: https://github.com/storytold/craft-anything"
        default: false
        script: 'ujust install-sdx-craft-anything; status=$?; echo; echo "Press Enter to close..."; read -r _; exit $status'
      - id: "install-sdx-rea"
        title: "REA (morluto/rea)"
        description: "REA (Reverse Engineer Anything, morluto/rea) is a CLI/MCP toolset that helps coding agents reverse engineer software (binaries, applications, and runtime behavior) with evidence-oriented workflows. Install method (priority): no official Flatpak/AppImage desktop package; user-local CLI install (preferred over rpm-ostree layering). Installs/sets up `rea-agents` using npm when available (`npm install --global rea-agents`) or provides `npx` guidance. Requires Node.js/npm (REA commonly targets Node 22.19+/supported LTS versions; check upstream docs). Deep native analysis may require external tools (Hopper/Ghidra/IDA) configured separately. Source: https://github.com/morluto/rea | Docs: https://rea.tools/"
        default: false
        script: 'ujust install-sdx-rea; status=$?; echo; echo "Press Enter to close..."; read -r _; exit $status'
      - id: "install-sdx-harbor"
        title: "Harbor (av/harbor)"
        description: "Harbor is a containerized local LLM toolkit/CLI that orchestrates Docker Compose-based AI services (backends, UIs, search, and related tools) with a unified workflow. Install method (priority): no Flatpak/AppImage/RPM appropriate for this toolkit; Docker/Compose-based setup (preferred for this project type). Runs Harbor's official installer (curl | bash) after confirmation. Prerequisites: Docker Engine + Docker Compose v2 (or compatible setup) and sufficient disk space. Source: https://github.com/av/harbor"
        default: false
        script: 'ujust install-sdx-harbor; status=$?; echo; echo "Press Enter to close..."; read -r _; exit $status'
      - id: "install-sdx-odysseus"
        title: "Odysseus (odysseus-dev/odysseus)"
        description: "Odysseus is a self-hosted AI workspace (chat/agents/research and productivity features as provided by the project) deployed via Docker Compose. Install method (priority): no Flatpak/AppImage/RPM appropriate; Docker/Compose-based setup. After confirmation, clones/updates ~/odysseus, creates .env from .env.example if missing, and runs 'docker compose up -d --build'. Default UI (when healthy): http://localhost:7011; first admin password appears in 'docker compose logs odysseus'. Prerequisites: Docker + Docker Compose and network access. Source: https://github.com/odysseus-dev/odysseus"
        default: false
        script: 'ujust install-sdx-odysseus; status=$?; echo; echo "Press Enter to close..."; read -r _; exit $status'

  - title: "Web Browsers"
    description: "Browsers and web tools"
    actions:
      - id: "install-sdx-brave"
        title: "Brave Browser"
        description: "Brave is a privacy-focused web browser with built-in ad and tracker blocking, HTTPS upgrading, and optional Brave features (depending on configuration). Install method (priority): Flatpak (preferred). Installs user Flatpak com.brave.Browser from Flathub (verified). Bazzite-SDX removes the Firefox RPM when present and offers Brave via this Flatpak-based setup. Source: https://brave.com/ | Flathub: https://flathub.org/en/apps/com.brave.Browser"
        default: false
        script: 'ujust install-sdx-brave; status=$?; echo; echo "Press Enter to close..."; read -r _; exit $status'

  - title: "Creative Utilities"
    description: "Design, modeling, and creative tools"
    actions:
      - id: "install-sdx-solidcraft"
        title: "SolidCraft"
        description: "SolidCraft (Tangency Labs) is a parametric CAD/modeling application for creating and iterating on 3D designs. Install method (priority): Flatpak (preferred). Installs user Flatpak io.tangencylabs.solidcraft from the SolidCraft Flatpak repository (Bazzite-SDX configures remotes; Flathub provides runtimes). Useful for mechanical/3D design and 3D printing workflows. Source: https://github.com/tangency-labs/solidcraft | Docs: https://docs.solidcraft.io/"
        default: false
        script: 'ujust install-sdx-solidcraft; status=$?; echo; echo "Press Enter to close..."; read -r _; exit $status'
      - id: "install-sdx-photocraft"
        title: "PhotoCraft"
        description: "PhotoCraft (storytold/photocraft) is an open source photo editor (built in Rust) for image editing and creative workflows. Install method (priority): upstream Flatpak bundle (preferred over AppImage/rpm-ostree). Downloads and installs the latest Linux x86_64 .flatpak bundle from GitHub releases at install time. Requires network access and may take time due to bundle/runtimes. Source: https://github.com/storytold/photocraft"
        default: false
        script: 'ujust install-sdx-photocraft; status=$?; echo; echo "Press Enter to close..."; read -r _; exit $status'
      - id: "install-sdx-pdfcraft"
        title: "PDFCraft"
        description: "PDFCraft (storytold/pdfcraft) is an open source PDF reader/editor (built in Rust) for viewing and working with PDF documents. Install method (priority): upstream Flatpak bundle (preferred over AppImage/rpm-ostree). Downloads and installs the latest Linux x86_64 .flatpak bundle from GitHub releases at install time. Requires network access and may take time due to bundle/runtimes. Source: https://github.com/storytold/pdfcraft"
        default: false
        script: 'ujust install-sdx-pdfcraft; status=$?; echo; echo "Press Enter to close..."; read -r _; exit $status'

  - title: "System Utilities"
    description: "Monitoring and desktop utilities"
    actions:
      - id: "install-sdx-mission-center"
        title: "Mission Center"
        description: "Mission Center is a modern system monitor for Linux showing CPU, memory, disk, network, and GPU usage (where supported), with per-app/process details and hardware information. Install method (priority): Flatpak (preferred). Installs user Flatpak io.missioncenter.MissionCenter from Flathub. Source: https://gitlab.com/mission-center-devs/mission-center | Flathub: https://flathub.org/en/apps/io.missioncenter.MissionCenter"
        default: false
        script: 'ujust install-sdx-mission-center; status=$?; echo; echo "Press Enter to close..."; read -r _; exit $status'
      - id: "install-sdx-gearlever"
        title: "Gear Lever (AppImage manager)"
        description: "Gear Lever helps you organize, integrate, and manage AppImage applications (menu entries, metadata, update workflows where supported). Install method (priority): Flatpak (preferred). Installs user Flatpak it.mijorus.gearlever from Flathub. Recommended for managing user AppImages like Unsloth Desktop installed via this portal. Source: https://github.com/mijorus/gearlever | Flathub: https://flathub.org/en/apps/it.mijorus.gearlever"
        default: false
        script: 'ujust install-sdx-gearlever; status=$?; echo; echo "Press Enter to close..."; read -r _; exit $status'

  - title: "Media"
    description: "Plex, playback, and web app tools"
    actions:
      - id: "install-sdx-plex-desktop"
        title: "Plex Player (Plex Desktop)"
        description: "Plex Desktop is the official Plex client for desktop playback and browsing your Plex libraries and services. Install method (priority): Flatpak (preferred). Installs user Flatpak tv.plex.PlexDesktop from Flathub. Requires a Plex account/server as applicable. Source: https://www.plex.tv/ | https://github.com/flathub/tv.plex.PlexDesktop"
        default: false
        script: 'ujust install-sdx-plex-desktop; status=$?; echo; echo "Press Enter to close..."; read -r _; exit $status'
      - id: "install-sdx-plex-htpc"
        title: "Plex HTPC"
        description: "Plex HTPC is Plex's home theater PC client with a TV-friendly interface, designed for big-screen setups and controller/remote use cases. Install method (priority): Flatpak (preferred). Installs user Flatpak tv.plex.PlexHTPC from Flathub. Source: https://www.plex.tv/media-server-downloads/#plex-app | https://github.com/flathub/tv.plex.PlexHTPC"
        default: false
        script: 'ujust install-sdx-plex-htpc; status=$?; echo; echo "Press Enter to close..."; read -r _; exit $status'
      - id: "install-sdx-vlc"
        title: "VLC media player"
        description: "VLC is a versatile, open source multimedia player that supports a wide range of audio/video formats, streams, and playback features. Install method (priority): Flatpak (preferred). Installs user Flatpak org.videolan.VLC from Flathub. Source: https://www.videolan.org/vlc/ | https://flathub.org/en/apps/org.videolan.VLC"
        default: false
        script: 'ujust install-sdx-vlc; status=$?; echo; echo "Press Enter to close..."; read -r _; exit $status'
      - id: "install-sdx-delfin"
        title: "Delfin (Jellyfin client)"
        description: "Delfin is a native Jellyfin client for streaming movies and TV shows from your Jellyfin server, with an MPV-based player and support for common Jellyfin plugins (as supported upstream). Install method (priority): Flatpak (preferred). Installs user Flatpak cafe.avery.Delfin from Flathub. Requires access to a Jellyfin server. Source: https://delfin.avery.cafe/ | https://flathub.org/en/apps/cafe.avery.Delfin"
        default: false
        script: 'ujust install-sdx-delfin; status=$?; echo; echo "Press Enter to close..."; read -r _; exit $status'
      - id: "install-sdx-web-app-hub"
        title: "Web App Hub"
        description: "Web App Hub lets you create and manage web apps (site-specific browser apps) with dedicated icons and profiles, using installed browsers where supported. Install method (priority): Flatpak (preferred). Installs user Flatpak org.pvermeer.WebAppHub from Flathub. Useful for turning web services into app-like launchers. Source: https://github.com/PVermeer/web-app-hub | https://flathub.org/en/apps/org.pvermeer.WebAppHub"
        default: false
        script: 'ujust install-sdx-web-app-hub; status=$?; echo; echo "Press Enter to close..."; read -r _; exit $status'

  - title: "System Management"
    description: "Updates, benchmarks, and system information"
    actions:
      - id: "check-sdx-system-updates"
        title: "Check for system updates (Bazzite-SDX image)"
        description: "Checks for bootc/rpm-ostree system updates (including newer Bazzite-SDX container builds available to your deployment) and shows status. After checking, it prompts whether you want to run the system update now; if you confirm, it runs 'ujust update'. On immutable/bootc systems, updates typically apply on reboot. May require sudo for checks/updates."
        default: false
        script: 'ujust check-sdx-system-updates; status=$?; echo; echo "Press Enter to close..."; read -r _; exit $status'
      - id: "run-sdx-benchmark"
        title: "Run system benchmark (ujust benchmark)"
        description: "Runs the Bazzite 'ujust benchmark' recipe (when available) to perform a quick CPU/system performance assessment. Useful for comparing performance or validating system behavior after changes. Output and runtime depend on the upstream recipe implementation."
        default: false
        script: 'ujust run-sdx-benchmark; status=$?; echo; echo "Press Enter to close..."; read -r _; exit $status'
      - id: "show-sdx-system-info"
        title: "Show system information (fastfetch)"
        description: "Displays detailed system information using 'fastfetch' (fallback to 'neofetch' or basic OS info if unavailable). Helpful for quickly viewing OS/image, kernel, CPU/GPU, memory, and environment details when troubleshooting or sharing support info."
        default: false
        script: 'ujust show-sdx-system-info; status=$?; echo; echo "Press Enter to close..."; read -r _; exit $status'
