      script: ujust install-sdx-rea; status=$?; echo; echo "Press Enter to close..."; read -r _; exit $status
  - id: install-sdx-harbor
    title: Harbor (av/harbor)
    description: Containerized local LLM toolkit that helps run and manage Docker Compose-based AI services and UIs.
    default: false
    status_script: command -v harbor >/dev/null 2>&1 && echo install || echo uninstall
    options:
    - id: install
      label: Install / Reinstall
      script: ujust install-sdx-harbor; status=$?; echo; echo "Press Enter to close..."; read -r _; exit $status
  - id: install-sdx-odysseus
    title: Odysseus (odysseus-dev/odysseus)
    description: Self-hosted AI workspace for chat, agents, and research-style productivity workflows.
    default: false
    status_script: '[ -d "$HOME/odysseus" ] && echo install || echo uninstall'
    options:
