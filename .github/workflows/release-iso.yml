--- 

name: Release ISO

on:
  workflow_dispatch:
    inputs:
      platform:
        required: true
        type: choice
        options:
          - amd64
          - arm64
      tag:
        description: "Git tag for release (e.g., v1.0.0 or 20261107)"
        required: true
        default: "20261107"

permissions:
  contents: write
  packages: read
  id-token: write

jobs:
  release-iso:
    name: Release ISO
    runs-on: ${{ inputs.platform == 'amd64' && 'ubuntu-26.04' || 'ubuntu-26.04-arm' }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Download ISO artifact
        uses: actions/download-artifact@8ecf1ef2a3c707a412e415199060b4665315133d # v4
        with:
          path: ./iso-artifacts
          pattern: "*amd64.iso*"
          merge-multiple: true

      - name: Prepare release
        id: prep
        shell: bash
        run: |
          TAG="${{ inputs.tag }}"
          SHA_SHORT=$(git rev-parse --short HEAD)
          echo "tag=${TAG}-${SHA_SHORT}" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@01570d5c94564605e56de3056d071533d9637614 # v2
        with:
          tag_name: ${{ steps.prep.outputs.tag }}
          name: Bazzite-SDX ${{ steps.prep.outputs.tag }}
          body: |
            ### Bazzite-SDX ISO Release
            
            This ISO can be flashed to a USB drive and used to install Bazzite-SDX on Surface devices.
            
            **Contains:**
            - Linux Surface kernel 7.2.15-1.surface.fc45
            - iptsd, libwacom-surface, surface-control
            - Fedora 45 base with all Surface drivers
            
            **SHA256:** (compute from artifact after download)
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
