---
name: Build container image
on:
  pull_request:
    branches:
      - main
  schedule:
    - cron: '05 10 * * *'  # 10:05am UTC everyday
  push:
    branches:
      - main
    paths-ignore:
      - '**/README.md'
  workflow_dispatch:

env:
  IMAGE_REGISTRY: "ghcr.io/${{ github.repository_owner }}"  # do not edit

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}-${{ inputs.brand_name}}-${{ inputs.stream_name }}
  cancel-in-progress: true

jobs:
  build_push:
    name: Build and push image
    runs-on: ubuntu-26.04

    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      # These stage versions are pinned by https://github.com/renovatebot/renovate
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Maximize build space
        uses: ublue-os/remove-unwanted-software@695eb75bc387dbcd9685a8e72d23439d8686cba6

      - name: Source environment
        run: |
          set -a
          source image-template.env
          set +a
          # Export environment variables so they are available to subsequent steps
          echo "IMAGE_NAME=${IMAGE_NAME}" >> ${GITHUB_ENV}
          echo "REPO_ORGANIZATION=${REPO_ORGANIZATION}" >> ${GITHUB_ENV}
          echo "IMAGE_DESC=${IMAGE_DESC}" >> ${GITHUB_ENV}
          echo "DEFAULT_TAG=${DEFAULT_TAG}" >> ${GITHUB_ENV}

      - name: Debug environment
        run: |
          echo "=== Environment Variables ==="
          echo "IMAGE_NAME=${IMAGE_NAME}"
          echo "REPO_ORGANIZATION=${REPO_ORGANIZATION}"
          echo "IMAGE_DESC=${IMAGE_DESC}"
          echo "DEFAULT_TAG=${DEFAULT_TAG}"

      # This actually builds the container image
      - name: Build Image
        id: build-image
        run: |
          set -euox pipefail

          # Image metadata
          LABELS=(
            "--label" "io.artifacthub.package.deprecated=false"
            "--label" "org.opencontainers.image.title=${IMAGE_NAME}"
            "--label" "org.opencontainers.image.description=${IMAGE_DESC}"
            "--label" "org.opencontainers.image.vendor=${REPO_ORGANIZATION}"
            "--label" "org.opencontainers.image.version=${DEFAULT_TAG}"
          )

          # Build the image
          podman build "${LABELS[@]}" --pull=newer --tag "${IMAGE_NAME}:${DEFAULT_TAG}" --file Containerfile .

      # This is optional, this provides smaller delta updates
      - name: Rechunk with rpm-ostree
        id: rechunk
        run: |
          IMAGE=$(podman inspect "${IMAGE_NAME}:${DEFAULT_TAG}" | jq -r '.[0].Id')
          podman untag "${IMAGE}"
          podman tag "${IMAGE}" "${IMAGE_NAME}:${DEFAULT_TAG}"
          podman images

      # If you are feeling adventurous, use the new distro agnostic rechunker
      # https://github.com/coreos/chunkah
      # You can delete the Rechunk with rpm-ostree portion then if you use this
      #- name: Rechunk with Chunkah
      #  id: rechunk
      #  run: |
      #    just rechunk \
      #      ${IMAGE_NAME} \
      #      ${DEFAULT_TAG}

      - name: Generate Build Tags
        id: gen-build-tags
        run: |
          set -euo pipefail
          DATE=$(date +%Y%m%d)
          BUILD_TAGS=()
          BUILD_TAGS+=("${DEFAULT_TAG}")
          BUILD_TAGS+=("${DEFAULT_TAG}-${DATE}")
          echo "Tags for this Action..."
          echo "${BUILD_TAGS[@]}"
          echo "alias_tags=${BUILD_TAGS[@]}" >> $GITHUB_OUTPUT

      - name: Tag Image
        id: tag-images
        env:
          ALIAS_TAGS: ${{ steps.gen-build-tags.outputs.alias_tags }}
        run: |
          set -euo pipefail

          # Get Image ID
          IMAGE=$(podman inspect "${IMAGE_NAME}:${DEFAULT_TAG}" | jq -r '.[0].Id')
          podman untag "${IMAGE}"

          # Tag Image
          for tag in ${ALIAS_TAGS}; do
            podman tag "${IMAGE}" "${IMAGE_NAME}:${tag}"
          done

          # Show Images
          podman images

      # These `if` statements are so that pull requests for your custom images do not make it publish any packages under your name without you knowing
      # They also check if the runner is on the default branch so that things like the merge queue (if you enable it), are going to work
      - name: Login to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push To GHCR
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        id: push-image
        env:
          ALIAS_TAGS: ${{ steps.gen-build-tags.outputs.alias_tags }}
        run: |
          set -euo pipefail
          for tag in ${ALIAS_TAGS}; do
            podman push --digestfile=/tmp/digestfile ${IMAGE_NAME}:${tag} ${IMAGE_REGISTRY}/${IMAGE_NAME}:${tag}
          done
          digest=$(< /tmp/digestfile)
          echo "Digest=${digest}" >> $GITHUB_OUTPUT

      - name: Sign container image
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        id: sign
        env:
          DIGEST: ${{ steps.push-image.outputs.digest }}
        run: |
          # Create a temporary key file from the secret
          echo "${{ secrets.COSIGN_PRIVATE_KEY }}" > /tmp/cosign.key
          cosign sign --key /tmp/cosign.key ${IMAGE_REGISTRY}/${IMAGE_NAME}@${DIGEST}
