---
name: Build container image
on:
  pull_request:
    branches:
      - main
  schedule:
    - cron: '05 10 * * *'  # 10:05am UTC everyday
  push:
    branches:
      - main
    paths-ignore:
      - '**/README.md'
  workflow_dispatch:

env:
  IMAGE_REGISTRY: "ghcr.io/nexgen-3d-printing"  # do not edit

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}-${{ inputs.brand_name}}-${{ inputs.stream_name }}
  cancel-in-progress: true

jobs:
  build_push:
    name: Build and push image
    runs-on: ubuntu-26.04

    permissions:
      contents: write
      packages: write
      id-token: write

    steps:
      # These stage versions are pinned by https://github.com/renovatebot/renovate
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Maximize build space
        uses: ublue-os/remove-unwanted-software@695eb75bc387dbcd9685a8e72d23439d8686cba6

      - name: Load environment
        id: load-env
        run: |
          # Source environment variables from image-template.env
          if [ -f image-template.env ]; then
            set -a
            source image-template.env
            set +a
          fi
          
          # Export environment variables so they are available to subsequent steps
          echo "IMAGE_NAME=${IMAGE_NAME%%[[:space:]]*}" >> ${GITHUB_ENV}
          echo "REPO_ORGANIZATION=${REPO_ORGANIZATION%%[[:space:]]*}" >> ${GITHUB_ENV}
          echo "IMAGE_DESC=${IMAGE_DESC%%[[:space:]]*}" >> ${GITHUB_ENV}
          echo "DEFAULT_TAG=${DEFAULT_TAG%%[[:space:]]*}" >> ${GITHUB_ENV}
          
          # Output them for verification
          printf "IMAGE_NAME=%s\n" "${IMAGE_NAME%%[[:space:]]*}" > ${GITHUB_OUTPUT}
          printf "REPO_ORGANIZATION=%s\n" "${REPO_ORGANIZATION%%[[:space:]]*}" >> ${GITHUB_OUTPUT}
          printf "IMAGE_DESC=%s\n" "${IMAGE_DESC%%[[:space:]]*}" >> ${GITHUB_OUTPUT}
          printf "DEFAULT_TAG=%s\n" "${DEFAULT_TAG%%[[:space:]]*}" >> ${GITHUB_OUTPUT}

      - name: Debug environment
        run: |
          echo "=== Environment Variables ==="
          echo "IMAGE_NAME=${{ steps.load-env.outputs.IMAGE_NAME }}"
          echo "REPO_ORGANIZATION=${{ steps.load-env.outputs.REPO_ORGANIZATION }}"
          echo "IMAGE_DESC=${{ steps.load-env.outputs.IMAGE_DESC }}"
          echo "DEFAULT_TAG=${{ steps.load-env.outputs.DEFAULT_TAG }}"

      # Fail fast: confirm the token can actually write to GHCR before spending
      # ~40 minutes building. Opening a blob upload session is the exact request
      # that a real `podman push` fails on, so it is an authoritative check and
      # costs nothing (no layer data is transferred).
      - name: Verify GHCR write access
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
          IMAGE_NAME: ${{ steps.load-env.outputs.IMAGE_NAME }}
        run: |
          set -euo pipefail
          REPO="${IMAGE_REGISTRY#ghcr.io/}/${IMAGE_NAME}"
          REPO="$(echo "${REPO}" | tr '[:upper:]' '[:lower:]')"
          echo "Checking write access to ghcr.io/${REPO}"

          TOKEN=$(curl -fsS -u "${GHCR_USER}:${GHCR_TOKEN}" \
            "https://ghcr.io/token?service=ghcr.io&scope=repository:${REPO}:push,pull" \
            | jq -r '.token')

          HEADERS=$(mktemp)
          BODY=$(mktemp)
          CODE=$(curl -sS -o "${BODY}" -D "${HEADERS}" -w '%{http_code}' \
            -X POST \
            -H "Authorization: Bearer ${TOKEN}" \
            "https://ghcr.io/v2/${REPO}/blobs/uploads/")

          echo "POST /v2/${REPO}/blobs/uploads/ -> HTTP ${CODE}"

          if [ "${CODE}" = "202" ]; then
            echo "GITHUB_TOKEN can write to ghcr.io/${REPO}"
            LOCATION=$(grep -i '^location:' "${HEADERS}" | cut -d' ' -f2 | tr -d '\r' || true)
            if [ -n "${LOCATION}" ]; then
              curl -sS -o /dev/null -X DELETE \
                -H "Authorization: Bearer ${TOKEN}" "${LOCATION}" || true
            fi
            exit 0
          fi

          echo "Registry response:"
          cat "${BODY}"
          echo "::error::GITHUB_TOKEN cannot write to ghcr.io/${REPO} (HTTP ${CODE})."
          echo "::error::The token authenticates but is not authorised for this package."
          echo "::error::Fix one of:"
          echo "::error::  a) package settings -> Manage Actions access -> add NexGen-3D-Printing/bazzite-sdx with Write"
          echo "::error::  b) delete the stale package so the next push recreates it linked to this repo"
          echo "::error::  c) account Settings -> Actions -> General -> Workflow permissions -> Read and write"
          exit 1

      # This actually builds the container image
      - name: Build Image
        id: build-image
        env:
          IMAGE_NAME: ${{ steps.load-env.outputs.IMAGE_NAME }}
          REPO_ORGANIZATION: ${{ steps.load-env.outputs.REPO_ORGANIZATION }}
          IMAGE_DESC: ${{ steps.load-env.outputs.IMAGE_DESC }}
          DEFAULT_TAG: ${{ steps.load-env.outputs.DEFAULT_TAG }}
        run: |
          set -euox pipefail

          # Debug: print environment variables
          echo "DEBUG: IMAGE_NAME=${IMAGE_NAME}"
          echo "DEBUG: IMAGE_DESC=${IMAGE_DESC}"
          echo "DEBUG: REPO_ORGANIZATION=${REPO_ORGANIZATION}"
          echo "DEBUG: DEFAULT_TAG=${DEFAULT_TAG}"

          # Image metadata
          LABELS=(
            "--label" "io.artifacthub.package.deprecated=false"
            "--label" "org.opencontainers.image.title=${IMAGE_NAME}"
            "--label" "org.opencontainers.image.description=${IMAGE_DESC}"
            "--label" "org.opencontainers.image.vendor=${REPO_ORGANIZATION}"
            "--label" "org.opencontainers.image.version=${DEFAULT_TAG}"
            "--label" "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}"
            "--label" "org.opencontainers.image.revision=${GITHUB_SHA}"
          )

          # Build the image
          podman build "${LABELS[@]}" --pull=newer --tag "${IMAGE_NAME}:${DEFAULT_TAG}" --file Containerfile .

      # This is optional, this provides smaller delta updates
      - name: Rechunk with rpm-ostree
        id: rechunk
        env:
          IMAGE_NAME: ${{ steps.load-env.outputs.IMAGE_NAME }}
          DEFAULT_TAG: ${{ steps.load-env.outputs.DEFAULT_TAG }}
        run: |
          IMAGE=$(podman inspect "${IMAGE_NAME}:${DEFAULT_TAG}" | jq -r '.[0].Id')
          podman untag "${IMAGE}"
          podman tag "${IMAGE}" "${IMAGE_NAME}:${DEFAULT_TAG}"
          podman images

      # If you are feeling adventurous, use the new distro agnostic rechunker
      # https://github.com/coreos/chunkah
      # You can delete the Rechunk with rpm-ostree portion then if you use this
      #- name: Rechunk with Chunkah
      #  id: rechunk
      #  run: |
      #    just rechunk \
      #      ${IMAGE_NAME} \
      #      ${DEFAULT_TAG}

      - name: Generate Build Tags
        id: gen-build-tags
        run: |
          set -euo pipefail
          DATE=$(date +%Y%m%d)
          BUILD_TAGS=()
          BUILD_TAGS+=("${DEFAULT_TAG}")
          BUILD_TAGS+=("${DEFAULT_TAG}-${DATE}")
          echo "Tags for this Action..."
          echo "${BUILD_TAGS[@]}"
          echo "alias_tags=${BUILD_TAGS[@]}" >> $GITHUB_OUTPUT

      - name: Tag Image
        id: tag-images
        env:
          IMAGE_NAME: ${{ steps.load-env.outputs.IMAGE_NAME }}
          DEFAULT_TAG: ${{ steps.load-env.outputs.DEFAULT_TAG }}
          ALIAS_TAGS: ${{ steps.gen-build-tags.outputs.alias_tags }}
        run: |
          set -euo pipefail

          # Get Image ID
          IMAGE=$(podman inspect "${IMAGE_NAME}:${DEFAULT_TAG}" | jq -r '.[0].Id')
          podman untag "${IMAGE}"

          # Tag Image
          for tag in ${ALIAS_TAGS}; do
            podman tag "${IMAGE}" "${IMAGE_NAME}:${tag}"
          done

          # Show Images
          podman images

      # These `if` statements are so that pull requests for your custom images do not make it publish any packages under your name without you knowing
      # They also check if the runner is on the default branch so that things like the merge queue (if you enable it), are going to work
      - name: Login to GitHub Container Registry (docker config)
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to GitHub Container Registry (podman)
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | podman login ghcr.io -u "${{ github.repository_owner }}" --password-stdin

      - name: Push To GHCR
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        id: push-image
        env:
          IMAGE_NAME: ${{ steps.load-env.outputs.IMAGE_NAME }}
          DEFAULT_TAG: ${{ steps.load-env.outputs.DEFAULT_TAG }}
          ALIAS_TAGS: ${{ steps.gen-build-tags.outputs.alias_tags }}
        run: |
          set -euo pipefail
          # Debug: show all environment variables
          echo "DEBUG: IMAGE_NAME=${IMAGE_NAME}"
          echo "DEBUG: IMAGE_REGISTRY=${IMAGE_REGISTRY}"
          echo "DEBUG: ALIAS_TAGS=${ALIAS_TAGS}"
          for tag in ${ALIAS_TAGS}; do
            DESTINATION="${IMAGE_REGISTRY}/${IMAGE_NAME}:${tag}"
            echo "DEBUG: Pushing ${IMAGE_NAME}:${tag} to ${DESTINATION}"
            # Podman might need transport prefix for the destination
            podman push --digestfile=/tmp/digestfile "${IMAGE_NAME}:${tag}" "docker://${DESTINATION}"
          done
          digest=$(< /tmp/digestfile)
          echo "Digest=${digest}" >> $GITHUB_OUTPUT

      - name: Install cosign
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: v2.6.1

      - name: Sign container image
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        id: sign
        env:
          DIGEST: ${{ steps.push-image.outputs.digest }}
          IMAGE_NAME: ${{ steps.load-env.outputs.IMAGE_NAME }}
          # The signing key uses an empty passphrase. cosign requires this
          # variable to be PRESENT (even if empty) or it prompts for a password
          # and fails on the non-interactive runner.
          COSIGN_PASSWORD: ""
        run: |
          set -euo pipefail
          # Create a temporary key file from the secret
          KEY_FILE=$(mktemp)
          trap 'rm -f "${KEY_FILE}"' EXIT
          printf '%s\n' "${{ secrets.COSIGN_PRIVATE_KEY }}" > "${KEY_FILE}"
          cosign sign --yes --key "${KEY_FILE}" "${IMAGE_REGISTRY}/${IMAGE_NAME}@${DIGEST}"

      - name: Update GitHub Release (app versions)
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
          DEFAULT_TAG: ${{ env.DEFAULT_TAG }}
        run: |
          set -euo pipefail
          IMG="${IMAGE_NAME}:${DEFAULT_TAG}"

          BRAVE_VERSION=$(podman run --rm --entrypoint /bin/sh "${IMG}" -lc 'brave-browser --version 2>/dev/null || rpm -q brave-browser 2>/dev/null || echo unknown' | head -n1)
          OPENCODE_CLI_VERSION=$(podman run --rm --entrypoint /bin/sh "${IMG}" -lc '/usr/local/bin/opencode --version 2>/dev/null || opencode --version 2>/dev/null || echo unknown' | head -n1)
          OPENCODE_DESKTOP_VERSION=$(podman run --rm --entrypoint /bin/sh "${IMG}" -lc 'rpm -qa | grep -i opencode.*desktop | head -n1 || rpm -q opencode-desktop 2>/dev/null || echo unknown' | head -n1)
          UNSLOTH_DESKTOP_VERSION=$(podman run --rm --entrypoint /bin/sh "${IMG}" -lc 'cat /opt/unsloth-desktop/version 2>/dev/null || grep -m1 "\"version\"" /opt/unsloth-desktop/resources/app/package.json 2>/dev/null | sed "s/.*: *\"\\([^\"]*\\)\".*/\\1/" || echo "installed (see /opt/unsloth-desktop)"' | head -n1)
          SOLIDCRAFT_VERSION=$(podman run --rm --entrypoint /bin/sh "${IMG}" -lc 'rpm -q solidcraft 2>/dev/null || rpm -qa | grep -i "^solidcraft" | head -n1 || echo unknown' | head -n1)
          ARTCRAFT_VERSION=$(podman run --rm --entrypoint /bin/sh "${IMG}" -lc 'rpm -q artcraft 2>/dev/null || rpm -qa | grep -i "^artcraft" | head -n1 || echo unknown' | head -n1)
          MISSION_CENTER_VERSION=$(podman run --rm --entrypoint /bin/sh "${IMG}" -lc 'rpm -q mission-center 2>/dev/null || rpm -q missioncenter 2>/dev/null || rpm -qa | grep -i "^mission.?center" | head -n1 || echo unknown' | head -n1)
          BASE_OS_PRETTY=$(podman run --rm --entrypoint /bin/sh "${IMG}" -lc '. /usr/lib/os-release 2>/dev/null; echo "${PRETTY_NAME:-unknown}"' | head -n1)
          BASE_OS_VERSION=$(podman run --rm --entrypoint /bin/sh "${IMG}" -lc '. /usr/lib/os-release 2>/dev/null; echo "${VERSION_ID:-${VERSION:-unknown}}"' | head -n1)
          BASE_OS_NAME=$(podman run --rm --entrypoint /bin/sh "${IMG}" -lc '. /usr/lib/os-release 2>/dev/null; echo "${NAME:-unknown}"' | head -n1)
          SURFACE_KERNEL=$(podman run --rm --entrypoint /bin/sh "${IMG}" -lc 'rpm -q kernel-surface --qf "%{VERSION}-%{RELEASE}" 2>/dev/null || echo unknown' | head -n1)

          TAG="latest"
          TITLE="Bazzite-SDX"
          {
            echo "## Bazzite-SDX"
            echo ""
            echo "Bazzite-DX with Linux Surface kernel support."
            echo ""
            echo "### Versions"
            echo "- **Bazzite/base OS:** ${BASE_OS_PRETTY} (VERSION_ID: ${BASE_OS_VERSION})"
            echo "- **Surface kernel:** ${SURFACE_KERNEL}"
            echo "- **Brave Browser:** ${BRAVE_VERSION}"
            echo "- **OpenCode CLI:** ${OPENCODE_CLI_VERSION}"
            echo "- **OpenCode Desktop:** ${OPENCODE_DESKTOP_VERSION}"
            echo "- **Unsloth Desktop:** ${UNSLOTH_DESKTOP_VERSION}"
            echo "- **SolidCraft:** ${SOLIDCRAFT_VERSION}"
            echo "- **ArtCraft:** ${ARTCRAFT_VERSION}"
            echo "- **Mission Center:** ${MISSION_CENTER_VERSION}"
            echo ""
            echo "### Features"
            echo "- Linux Surface kernel (kernel-surface)"
            echo "- iptsd, libwacom-surface, surface-control"
            echo "- Brave Browser (Firefox removed)"
            echo "- OpenCode CLI and OpenCode Desktop"
            echo "- Unsloth Desktop"
            echo "- SolidCraft and ArtCraft"
            echo "- Mission Center"
            echo "- Based on \`ghcr.io/ublue-os/bazzite-dx:stable\` (detected base OS: ${BASE_OS_NAME} ${BASE_OS_VERSION})"
            echo ""
            echo "### Install (rebase)"
            echo "Install an official Bazzite image first (or use an existing Fedora Atomic/Bazzite/Kinoite installation compatible with bootc), then rebase to Bazzite-SDX:"
            echo ""
            echo '```bash'
            echo "# Verify current state"
            echo "sudo bootc status"
            echo ""
            echo "# Rebase to Bazzite-SDX (based on Bazzite-DX)"
            echo "sudo bootc switch ghcr.io/nexgen-3d-printing/bazzite-sdx:latest"
            echo ""
            echo "# Verify the switch"
            echo "sudo bootc status"
            echo ""
            echo "# Pull and apply updates"
            echo "sudo bootc fetch --apply"
            echo '```'
            echo ""
            echo "### Security verification"
            echo '```bash'
            echo "cosign verify --key cosign.pub ghcr.io/nexgen-3d-printing/bazzite-sdx:latest"
            echo '```'
            echo ""
            echo "### Related resources"
            echo "- **Bazzite-SDX repository:** https://github.com/NexGen-3D-Printing/bazzite-sdx"
            echo "- **Bazzite-DX:** https://github.com/ublue-os/bazzite-dx"
            echo "- **Surface Linux kernel:** https://github.com/linux-surface/linux-surface"
            echo "- **Brave:** https://brave.com/linux/"
            echo "- **OpenCode:** https://github.com/anomalyco/opencode"
            echo "- **Unsloth:** https://github.com/unslothai/unsloth"
            echo "- **SolidCraft:** https://github.com/tangency-labs/solidcraft"
            echo "- **ArtCraft:** https://github.com/storytold/artcraft"
            echo "- **Mission Center:** https://gitlab.com/mission-center-devs/mission-center"
          } > /tmp/release-notes.md

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "$TITLE" --notes-file /tmp/release-notes.md --latest
          else
            gh release create "$TAG" --title "$TITLE" --notes-file /tmp/release-notes.md --latest
          fi
