---
name: Build container image
on:
  pull_request:
    branches:
      - main
  schedule:
    - cron: '05 10 * * *'  # 10:05am UTC everyday
  push:
    branches:
      - main
    paths-ignore:
      - '**/README.md'
  workflow_dispatch:

env:
  IMAGE_REGISTRY: "ghcr.io/nexgen-3d-printing"  # do not edit

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}-${{ inputs.brand_name}}-${{ inputs.stream_name }}
  cancel-in-progress: true

jobs:
  build_push:
    name: Build and push image
    runs-on: ubuntu-26.04

    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      # These stage versions are pinned by https://github.com/renovatebot/renovate
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Maximize build space
        uses: ublue-os/remove-unwanted-software@695eb75bc387dbcd9685a8e72d23439d8686cba6

      - name: Load environment
        id: load-env
        run: |
          # Source environment variables from image-template.env
          if [ -f image-template.env ]; then
            set -a
            source image-template.env
            set +a
          fi
          
          # Export environment variables so they are available to subsequent steps
          echo "IMAGE_NAME=${IMAGE_NAME%%[[:space:]]*}" >> ${GITHUB_ENV}
          echo "REPO_ORGANIZATION=${REPO_ORGANIZATION%%[[:space:]]*}" >> ${GITHUB_ENV}
          echo "IMAGE_DESC=${IMAGE_DESC%%[[:space:]]*}" >> ${GITHUB_ENV}
          echo "DEFAULT_TAG=${DEFAULT_TAG%%[[:space:]]*}" >> ${GITHUB_ENV}
          
          # Output them for verification
          printf "IMAGE_NAME=%s\n" "${IMAGE_NAME%%[[:space:]]*}" > ${GITHUB_OUTPUT}
          printf "REPO_ORGANIZATION=%s\n" "${REPO_ORGANIZATION%%[[:space:]]*}" >> ${GITHUB_OUTPUT}
          printf "IMAGE_DESC=%s\n" "${IMAGE_DESC%%[[:space:]]*}" >> ${GITHUB_OUTPUT}
          printf "DEFAULT_TAG=%s\n" "${DEFAULT_TAG%%[[:space:]]*}" >> ${GITHUB_OUTPUT}

      - name: Debug environment
        run: |
          echo "=== Environment Variables ==="
          echo "IMAGE_NAME=${{ steps.load-env.outputs.IMAGE_NAME }}"
          echo "REPO_ORGANIZATION=${{ steps.load-env.outputs.REPO_ORGANIZATION }}"
          echo "IMAGE_DESC=${{ steps.load-env.outputs.IMAGE_DESC }}"
          echo "DEFAULT_TAG=${{ steps.load-env.outputs.DEFAULT_TAG }}"

      # This actually builds the container image
      - name: Build Image
        id: build-image
        env:
          IMAGE_NAME: ${{ steps.load-env.outputs.IMAGE_NAME }}
          REPO_ORGANIZATION: ${{ steps.load-env.outputs.REPO_ORGANIZATION }}
          IMAGE_DESC: ${{ steps.load-env.outputs.IMAGE_DESC }}
          DEFAULT_TAG: ${{ steps.load-env.outputs.DEFAULT_TAG }}
        run: |
          set -euox pipefail

          # Debug: print environment variables
          echo "DEBUG: IMAGE_NAME=${IMAGE_NAME}"
          echo "DEBUG: IMAGE_DESC=${IMAGE_DESC}"
          echo "DEBUG: REPO_ORGANIZATION=${REPO_ORGANIZATION}"
          echo "DEBUG: DEFAULT_TAG=${DEFAULT_TAG}"

          # Image metadata
          LABELS=(
            "--label" "io.artifacthub.package.deprecated=false"
            "--label" "org.opencontainers.image.title=${IMAGE_NAME}"
            "--label" "org.opencontainers.image.description=${IMAGE_DESC}"
            "--label" "org.opencontainers.image.vendor=${REPO_ORGANIZATION}"
            "--label" "org.opencontainers.image.version=${DEFAULT_TAG}"
          )

          # Build the image
          podman build "${LABELS[@]}" --pull=newer --tag "${IMAGE_NAME}:${DEFAULT_TAG}" --file Containerfile .

      # This is optional, this provides smaller delta updates
      - name: Rechunk with rpm-ostree
        id: rechunk
        env:
          IMAGE_NAME: ${{ steps.load-env.outputs.IMAGE_NAME }}
          DEFAULT_TAG: ${{ steps.load-env.outputs.DEFAULT_TAG }}
        run: |
          IMAGE=$(podman inspect "${IMAGE_NAME}:${DEFAULT_TAG}" | jq -r '.[0].Id')
          podman untag "${IMAGE}"
          podman tag "${IMAGE}" "${IMAGE_NAME}:${DEFAULT_TAG}"
          podman images

      # If you are feeling adventurous, use the new distro agnostic rechunker
      # https://github.com/coreos/chunkah
      # You can delete the Rechunk with rpm-ostree portion then if you use this
      #- name: Rechunk with Chunkah
      #  id: rechunk
      #  run: |
      #    just rechunk \
      #      ${IMAGE_NAME} \
      #      ${DEFAULT_TAG}

      - name: Generate Build Tags
        id: gen-build-tags
        run: |
          set -euo pipefail
          DATE=$(date +%Y%m%d)
          BUILD_TAGS=()
          BUILD_TAGS+=("${DEFAULT_TAG}")
          BUILD_TAGS+=("${DEFAULT_TAG}-${DATE}")
          echo "Tags for this Action..."
          echo "${BUILD_TAGS[@]}"
          echo "alias_tags=${BUILD_TAGS[@]}" >> $GITHUB_OUTPUT

      - name: Tag Image
        id: tag-images
        env:
          IMAGE_NAME: ${{ steps.load-env.outputs.IMAGE_NAME }}
          DEFAULT_TAG: ${{ steps.load-env.outputs.DEFAULT_TAG }}
          ALIAS_TAGS: ${{ steps.gen-build-tags.outputs.alias_tags }}
        run: |
          set -euo pipefail

          # Get Image ID
          IMAGE=$(podman inspect "${IMAGE_NAME}:${DEFAULT_TAG}" | jq -r '.[0].Id')
          podman untag "${IMAGE}"

          # Tag Image
          for tag in ${ALIAS_TAGS}; do
            podman tag "${IMAGE}" "${IMAGE_NAME}:${tag}"
          done

          # Show Images
          podman images

      # These `if` statements are so that pull requests for your custom images do not make it publish any packages under your name without you knowing
      # They also check if the runner is on the default branch so that things like the merge queue (if you enable it), are going to work
      - name: Create package in GHCR
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        run: |
          # Create the package in GHCR if it doesn't exist
          # GHCR requires the package to be explicitly created for first-time pushes
          curl -X POST \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            -d '{"package_type":"container"}' \
            "https://ghcr.io/v2/nexgen-3d-printing/bazzite-sdx/settings"
        continue-on-error: true

      - name: Login to GitHub Container Registry
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | podman login ghcr.io -u "${{ github.repository_owner }}" --password-stdin

      - name: Push To GHCR
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        id: push-image
        env:
          IMAGE_NAME: ${{ steps.load-env.outputs.IMAGE_NAME }}
          DEFAULT_TAG: ${{ steps.load-env.outputs.DEFAULT_TAG }}
          ALIAS_TAGS: ${{ steps.gen-build-tags.outputs.alias_tags }}
        run: |
          set -euo pipefail
          # Debug: show all environment variables
          echo "DEBUG: IMAGE_NAME=${IMAGE_NAME}"
          echo "DEBUG: IMAGE_REGISTRY=${IMAGE_REGISTRY}"
          echo "DEBUG: ALIAS_TAGS=${ALIAS_TAGS}"
          for tag in ${ALIAS_TAGS}; do
            DESTINATION="${IMAGE_REGISTRY}/${IMAGE_NAME}:${tag}"
            echo "DEBUG: Pushing ${IMAGE_NAME}:${tag} to ${DESTINATION}"
            # Podman might need transport prefix for the destination
            podman push --digestfile=/tmp/digestfile "${IMAGE_NAME}:${tag}" "docker://${DESTINATION}"
          done
          digest=$(< /tmp/digestfile)
          echo "Digest=${digest}" >> $GITHUB_OUTPUT

      - name: Sign container image
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        id: sign
        env:
          DIGEST: ${{ steps.push-image.outputs.digest }}
          IMAGE_NAME: ${{ steps.load-env.outputs.IMAGE_NAME }}
        run: |
          # Create a temporary key file from the secret
          echo "${{ secrets.COSIGN_PRIVATE_KEY }}" > /tmp/cosign.key
          cosign sign --key /tmp/cosign.key "${IMAGE_REGISTRY}/${IMAGE_NAME}@${DIGEST}"
