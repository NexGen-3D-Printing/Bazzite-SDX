---
name: Build container image
on:
  pull_request:
    branches:
      - main
  schedule:
    # Upstream drift check every 6 hours. Builds stable/testing only when
    # Bazzite-DX, linux-surface packages, or SDX Control Centre changed.
    - cron: '0 */6 * * *'
  push:
    branches:
      - main
      - testing
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      channel:
        description: 'Channel to build: auto (drift check), stable, testing, both, or unstable'
        required: false
        type: choice
        default: auto
        options:
          - auto
          - stable
          - testing
          - both
          - unstable

env:
  IMAGE_REGISTRY: "ghcr.io/nexgen-3d-printing"  # do not edit

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}-${{ inputs.brand_name}}-${{ inputs.stream_name }}
  cancel-in-progress: true

jobs:
  check_upstream:
    name: Check upstream drift
    if: |
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && inputs.channel == 'auto')
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      actions: read
    outputs:
      stable_drift: ${{ steps.detect.outputs.stable_drift }}
      testing_drift: ${{ steps.detect.outputs.testing_drift }}
      drift: ${{ steps.detect.outputs.drift }}
      stable_bazzite_version: ${{ steps.detect.outputs.stable_bazzite_version }}
      testing_bazzite_version: ${{ steps.detect.outputs.testing_bazzite_version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Skip when another build is active
        id: active
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          count=$(gh run list --workflow build.yml --limit 30 --json databaseId,status \
            | jq --arg id "${GITHUB_RUN_ID}" '[.[] | select(.status == "in_progress" or .status == "queued") | select((.databaseId|tostring) != $id)] | length')
          if [ "${count}" -gt 0 ]; then
            echo "Another build is active (${count}); skipping the upstream check."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Ensure zstd and skopeo are available
        if: steps.active.outputs.skip != 'true'
        run: |
          command -v zstd >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y zstd)
          command -v skopeo >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y skopeo)

      - name: Detect upstream drift
        id: detect
        if: steps.active.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 .github/scripts/check_upstream.py

  plan:
    name: Plan builds
    needs: check_upstream
    if: |
      !cancelled() &&
      needs.check_upstream.result != 'failure'
    runs-on: ubuntu-26.04
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      has_builds: ${{ steps.plan.outputs.has_builds }}
    steps:
      - name: Determine build matrix
        id: plan
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          INPUT_CHANNEL: ${{ inputs.channel || 'auto' }}
          STABLE_DRIFT: ${{ needs.check_upstream.outputs.stable_drift || 'false' }}
          TESTING_DRIFT: ${{ needs.check_upstream.outputs.testing_drift || 'false' }}
        run: |
          set -euo pipefail
          channels=()

          add_channel() {
            local ch="$1"
            for existing in "${channels[@]+"${channels[@]}"}"; do
              [[ "$existing" == "$ch" ]] && return 0
            done
            channels+=("$ch")
          }

          if [[ "${EVENT_NAME}" == "pull_request" ]]; then
            add_channel "testing"
          elif [[ "${EVENT_NAME}" == "push" && "${REF}" == refs/tags/v* ]]; then
            add_channel "stable"
          elif [[ "${EVENT_NAME}" == "push" && "${REF}" == "refs/heads/main" ]]; then
            add_channel "stable"
          elif [[ "${EVENT_NAME}" == "push" && "${REF}" == "refs/heads/testing" ]]; then
            add_channel "testing"
          elif [[ "${EVENT_NAME}" == "workflow_dispatch" ]]; then
            case "${INPUT_CHANNEL}" in
              stable) add_channel "stable" ;;
              testing) add_channel "testing" ;;
              both) add_channel "stable"; add_channel "testing" ;;
              unstable) add_channel "unstable" ;;
              auto)
                [[ "${STABLE_DRIFT}" == "true" ]] && add_channel "stable"
                [[ "${TESTING_DRIFT}" == "true" ]] && add_channel "testing"
                ;;
              *) echo "::error::Unknown channel ${INPUT_CHANNEL}"; exit 1 ;;
            esac
          elif [[ "${EVENT_NAME}" == "schedule" ]]; then
            [[ "${STABLE_DRIFT}" == "true" ]] && add_channel "stable"
            [[ "${TESTING_DRIFT}" == "true" ]] && add_channel "testing"
          fi

          if [[ ${#channels[@]} -eq 0 ]]; then
            echo "No channels to build."
            echo 'matrix={"include":[]}' >> "$GITHUB_OUTPUT"
            echo "has_builds=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          json='{"include":['
          first=true
          for ch in "${channels[@]}"; do
            if [[ "$first" == "true" ]]; then first=false; else json+=','; fi
            case "$ch" in
              stable)
                base="ghcr.io/ublue-os/bazzite-dx:stable"
                ;;
              testing)
                base="ghcr.io/ublue-os/bazzite-dx:testing"
                ;;
              unstable)
                base="ghcr.io/ublue-os/bazzite-dx:unstable"
                ;;
              *) echo "::error::Unknown channel $ch"; exit 1 ;;
            esac
            json+="{\"channel\":\"${ch}\",\"base_image\":\"${base}\"}"
          done
          json+=']}'

          echo "matrix=${json}" >> "$GITHUB_OUTPUT"
          echo "has_builds=true" >> "$GITHUB_OUTPUT"
          echo "Planned channels: ${channels[*]}"

  build_push:
    name: Build and push (${{ matrix.channel }})
    needs: [check_upstream, plan]
    if: always() && needs.plan.result == 'success' && needs.plan.outputs.has_builds == 'true'
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}

    permissions:
      contents: write
      packages: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Maximize build space
        uses: ublue-os/remove-unwanted-software@695eb75bc387dbcd9685a8e72d23439d8686cba6

      - name: Load environment
        id: load-env
        run: |
          if [ -f image-template.env ]; then
            set -a
            source image-template.env
            set +a
          fi
          echo "IMAGE_NAME=${IMAGE_NAME%%[[:space:]]*}" >> ${GITHUB_ENV}
          echo "REPO_ORGANIZATION=${REPO_ORGANIZATION%%[[:space:]]*}" >> ${GITHUB_ENV}
          echo "IMAGE_DESC=${IMAGE_DESC%%[[:space:]]*}" >> ${GITHUB_ENV}
          echo "DEFAULT_TAG=${DEFAULT_TAG%%[[:space:]]*}" >> ${GITHUB_ENV}
          printf "IMAGE_NAME=%s\n" "${IMAGE_NAME%%[[:space:]]*}" > ${GITHUB_OUTPUT}
          printf "REPO_ORGANIZATION=%s\n" "${REPO_ORGANIZATION%%[[:space:]]*}" >> ${GITHUB_OUTPUT}
          printf "IMAGE_DESC=%s\n" "${IMAGE_DESC%%[[:space:]]*}" >> ${GITHUB_OUTPUT}
          printf "DEFAULT_TAG=%s\n" "${DEFAULT_TAG%%[[:space:]]*}" >> ${GITHUB_OUTPUT}

      - name: Resolve channel, version, and publish settings
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          MATRIX_CHANNEL: ${{ matrix.channel }}
          MATRIX_BASE_IMAGE: ${{ matrix.base_image }}
        run: |
          set -euo pipefail
          SHORT_SHA="${SHA:0:7}"
          DATE_UTC="$(date -u +%Y%m%d)"
          FILE_VERSION="$(tr -d '[:space:]' < VERSION 2>/dev/null || echo 0.0.0)"
          CHANNEL="${MATRIX_CHANNEL}"
          PUBLISH=true
          VERSION_LABEL=""
          RELEASE_KIND="${MATRIX_CHANNEL}"   # stable|testing|semver|unstable|pr
          SEMVER_TAG=""
          SEMVER_NUM=""

          if [[ "${EVENT_NAME}" == "pull_request" ]]; then
            CHANNEL="pr"
            PUBLISH=false
            VERSION_LABEL="pr-${SHORT_SHA}"
            RELEASE_KIND="none"
          elif [[ "${REF}" == refs/tags/v* ]]; then
            SEMVER_TAG="${REF_NAME}"
            if [[ "${SEMVER_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              SEMVER_NUM="${SEMVER_TAG#v}"
              if [[ "${FILE_VERSION}" != "${SEMVER_NUM}" ]]; then
                echo "::error::VERSION file (${FILE_VERSION}) does not match tag ${SEMVER_TAG} (expected ${SEMVER_NUM})"
                exit 1
              fi
              CHANNEL="stable"
              PUBLISH=true
              VERSION_LABEL="${SEMVER_TAG}"
              RELEASE_KIND="semver"
            else
              echo "::error::Unsupported tag format '${SEMVER_TAG}'. Use SemVer tags like v0.1.0."
              exit 1
            fi
          elif [[ "${MATRIX_CHANNEL}" == "stable" ]]; then
            CHANNEL="stable"
            PUBLISH=true
            VERSION_LABEL="stable-${DATE_UTC}+${SHORT_SHA}"
            RELEASE_KIND="stable"
          elif [[ "${MATRIX_CHANNEL}" == "testing" ]]; then
            CHANNEL="testing"
            PUBLISH=true
            VERSION_LABEL="testing-${DATE_UTC}+${SHORT_SHA}"
            RELEASE_KIND="testing"
          elif [[ "${MATRIX_CHANNEL}" == "unstable" ]]; then
            CHANNEL="unstable"
            PUBLISH=true
            VERSION_LABEL="unstable-${DATE_UTC}+${SHORT_SHA}"
            RELEASE_KIND="unstable"
          else
            echo "::error::Unknown matrix channel ${MATRIX_CHANNEL}"
            exit 1
          fi

          {
            echo "channel=${CHANNEL}"
            echo "publish=${PUBLISH}"
            echo "version_label=${VERSION_LABEL}"
            echo "release_kind=${RELEASE_KIND}"
            echo "semver_tag=${SEMVER_TAG}"
            echo "semver_num=${SEMVER_NUM}"
            echo "short_sha=${SHORT_SHA}"
            echo "date_utc=${DATE_UTC}"
            echo "file_version=${FILE_VERSION}"
            echo "base_image=${MATRIX_BASE_IMAGE}"
          } >> "$GITHUB_OUTPUT"

      - name: Debug environment
        env:
          CHANNEL: ${{ steps.version.outputs.channel }}
          PUBLISH: ${{ steps.version.outputs.publish }}
          VERSION_LABEL: ${{ steps.version.outputs.version_label }}
          RELEASE_KIND: ${{ steps.version.outputs.release_kind }}
          SEMVER_TAG: ${{ steps.version.outputs.semver_tag }}
        run: |
          echo "=== Environment Variables ==="
          echo "IMAGE_NAME=${{ steps.load-env.outputs.IMAGE_NAME }}"
          echo "REPO_ORGANIZATION=${{ steps.load-env.outputs.REPO_ORGANIZATION }}"
          echo "IMAGE_DESC=${{ steps.load-env.outputs.IMAGE_DESC }}"
          echo "DEFAULT_TAG=${{ steps.load-env.outputs.DEFAULT_TAG }}"
          echo "CHANNEL=${CHANNEL}"
          echo "PUBLISH=${PUBLISH}"
          echo "VERSION_LABEL=${VERSION_LABEL}"
          echo "RELEASE_KIND=${RELEASE_KIND}"
          echo "SEMVER_TAG=${SEMVER_TAG}"

      - name: Verify GHCR write access
        if: steps.version.outputs.publish == 'true'
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
          IMAGE_NAME: ${{ steps.load-env.outputs.IMAGE_NAME }}
        run: |
          set -euo pipefail
          REPO="${IMAGE_REGISTRY#ghcr.io/}/${IMAGE_NAME}"
          REPO="$(echo "${REPO}" | tr '[:upper:]' '[:lower:]')"
          echo "Checking write access to ghcr.io/${REPO}"
          TOKEN=$(curl -fsS -u "${GHCR_USER}:${GHCR_TOKEN}" \
            "https://ghcr.io/token?service=ghcr.io&scope=repository:${REPO}:push,pull" \
            | jq -r '.token')
          HEADERS=$(mktemp)
          BODY=$(mktemp)
          CODE=$(curl -sS -o "${BODY}" -D "${HEADERS}" -w '%{http_code}' \
            -X POST \
            -H "Authorization: Bearer ${TOKEN}" \
            "https://ghcr.io/v2/${REPO}/blobs/uploads/")
          echo "POST /v2/${REPO}/blobs/uploads/ -> HTTP ${CODE}"
          if [ "${CODE}" = "202" ]; then
            LOCATION=$(grep -i '^location:' "${HEADERS}" | cut -d' ' -f2 | tr -d '\r' || true)
            if [ -n "${LOCATION}" ]; then
              curl -sS -o /dev/null -X DELETE -H "Authorization: Bearer ${TOKEN}" "${LOCATION}" || true
            fi
            exit 0
          fi
          cat "${BODY}"
          echo "::error::GITHUB_TOKEN cannot write to ghcr.io/${REPO} (HTTP ${CODE})."
          exit 1

      - name: Build Image
        id: build-image
        env:
          IMAGE_NAME: ${{ steps.load-env.outputs.IMAGE_NAME }}
          REPO_ORGANIZATION: ${{ steps.load-env.outputs.REPO_ORGANIZATION }}
          IMAGE_DESC: ${{ steps.load-env.outputs.IMAGE_DESC }}
          DEFAULT_TAG: ${{ steps.load-env.outputs.DEFAULT_TAG }}
          VERSION_LABEL: ${{ steps.version.outputs.version_label }}
          BASE_IMAGE: ${{ steps.version.outputs.base_image }}
        run: |
          set -euox pipefail
          LABELS=(
            "--label" "io.artifacthub.package.deprecated=false"
            "--label" "org.opencontainers.image.title=${IMAGE_NAME}"
            "--label" "org.opencontainers.image.description=${IMAGE_DESC}"
            "--label" "org.opencontainers.image.vendor=${REPO_ORGANIZATION}"
            "--label" "org.opencontainers.image.version=${VERSION_LABEL}"
            "--label" "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}"
            "--label" "org.opencontainers.image.revision=${GITHUB_SHA}"
          )
          podman build "${LABELS[@]}" --pull=newer --build-arg "BASE_IMAGE=${BASE_IMAGE}" --tag "${IMAGE_NAME}:${DEFAULT_TAG}" --file Containerfile .

      - name: Rechunk with rpm-ostree
        id: rechunk
        env:
          IMAGE_NAME: ${{ steps.load-env.outputs.IMAGE_NAME }}
          DEFAULT_TAG: ${{ steps.load-env.outputs.DEFAULT_TAG }}
        run: |
          IMAGE=$(podman inspect "${IMAGE_NAME}:${DEFAULT_TAG}" | jq -r '.[0].Id')
          podman untag "${IMAGE}"
          podman tag "${IMAGE}" "${IMAGE_NAME}:${DEFAULT_TAG}"
          podman images

      - name: Generate Build Tags
        id: gen-build-tags
        env:
          CHANNEL: ${{ steps.version.outputs.channel }}
          SEMVER_TAG: ${{ steps.version.outputs.semver_tag }}
          SEMVER_NUM: ${{ steps.version.outputs.semver_num }}
          SHORT_SHA: ${{ steps.version.outputs.short_sha }}
          DATE_UTC: ${{ steps.version.outputs.date_utc }}
        run: |
          set -euo pipefail
          BUILD_TAGS=()
          case "${CHANNEL}" in
            stable)
              BUILD_TAGS+=("stable")
              BUILD_TAGS+=("stable-${DATE_UTC}")
              BUILD_TAGS+=("sha-${SHORT_SHA}")
              ;;
            testing)
              BUILD_TAGS+=("testing")
              BUILD_TAGS+=("testing-${DATE_UTC}")
              BUILD_TAGS+=("sha-${SHORT_SHA}")
              ;;
            unstable)
              # Manual unstable build (only when explicitly triggered)
              BUILD_TAGS+=("unstable")
              BUILD_TAGS+=("unstable-${DATE_UTC}")
              BUILD_TAGS+=("sha-${SHORT_SHA}")
              ;;
            semver)
              # Explicit pinned SemVer release (coexists with weekly/testing channels)
              MINOR="${SEMVER_NUM%.*}"
              BUILD_TAGS+=("${SEMVER_TAG}")
              BUILD_TAGS+=("v${MINOR}")
              BUILD_TAGS+=("sha-${SHORT_SHA}")
              ;;
            *)
              BUILD_TAGS+=("sha-${SHORT_SHA}")
              ;;
          esac
          echo "Tags for this Action..."
          echo "${BUILD_TAGS[@]}"
          echo "alias_tags=${BUILD_TAGS[@]}" >> "$GITHUB_OUTPUT"

      - name: Tag Image
        id: tag-images
        env:
          IMAGE_NAME: ${{ steps.load-env.outputs.IMAGE_NAME }}
          DEFAULT_TAG: ${{ steps.load-env.outputs.DEFAULT_TAG }}
          ALIAS_TAGS: ${{ steps.gen-build-tags.outputs.alias_tags }}
        run: |
          set -euo pipefail
          IMAGE=$(podman inspect "${IMAGE_NAME}:${DEFAULT_TAG}" | jq -r '.[0].Id')
          podman untag "${IMAGE}"
          for tag in ${ALIAS_TAGS}; do
            podman tag "${IMAGE}" "${IMAGE_NAME}:${tag}"
          done
          podman images

      - name: Login to GitHub Container Registry (docker config)
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        if: steps.version.outputs.publish == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to GitHub Container Registry (podman)
        if: steps.version.outputs.publish == 'true'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | podman login ghcr.io -u "${{ github.repository_owner }}" --password-stdin

      - name: Push To GHCR
        if: steps.version.outputs.publish == 'true'
        id: push-image
        env:
          IMAGE_NAME: ${{ steps.load-env.outputs.IMAGE_NAME }}
          ALIAS_TAGS: ${{ steps.gen-build-tags.outputs.alias_tags }}
          CHANNEL: ${{ steps.version.outputs.channel }}
          SEMVER_TAG: ${{ steps.version.outputs.semver_tag }}
        run: |
          set -euo pipefail
          echo "DEBUG: ALIAS_TAGS=${ALIAS_TAGS}"
          PRIMARY_DIGEST_TAG="${CHANNEL}"
          if [[ "${CHANNEL}" == "semver" && -n "${SEMVER_TAG}" ]]; then PRIMARY_DIGEST_TAG="${SEMVER_TAG}"; fi
          for tag in ${ALIAS_TAGS}; do
            DESTINATION="${IMAGE_REGISTRY}/${IMAGE_NAME}:${tag}"
            echo "DEBUG: Pushing ${IMAGE_NAME}:${tag} to ${DESTINATION}"
            podman push --digestfile=/tmp/digestfile "${IMAGE_NAME}:${tag}" "docker://${DESTINATION}"
            if [[ "${tag}" == "${PRIMARY_DIGEST_TAG}" ]]; then
              cp /tmp/digestfile /tmp/primary-digestfile
            fi
          done
          if [[ -f /tmp/primary-digestfile ]]; then
            digest=$(< /tmp/primary-digestfile)
          else
            digest=$(< /tmp/digestfile)
          fi
          echo "Digest=${digest}" >> $GITHUB_OUTPUT
          echo "digest_tag=${PRIMARY_DIGEST_TAG}" >> $GITHUB_OUTPUT

      - name: Install cosign
        if: steps.version.outputs.publish == 'true'
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: v2.6.1

      - name: Sign container image
        if: steps.version.outputs.publish == 'true'
        id: sign
        env:
          DIGEST: ${{ steps.push-image.outputs.digest }}
          IMAGE_NAME: ${{ steps.load-env.outputs.IMAGE_NAME }}
          COSIGN_PASSWORD: ""
        run: |
          set -euo pipefail
          KEY_FILE=$(mktemp)
          trap 'rm -f "${KEY_FILE}"' EXIT
          printf '%s\n' "${{ secrets.COSIGN_PRIVATE_KEY }}" > "${KEY_FILE}"
          cosign sign --yes --key "${KEY_FILE}" "${IMAGE_REGISTRY}/${IMAGE_NAME}@${DIGEST}"

      - name: Update GitHub Release
        if: steps.version.outputs.release_kind != 'none' && steps.version.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_NAME: ${{ steps.load-env.outputs.IMAGE_NAME }}
          DEFAULT_TAG: ${{ steps.load-env.outputs.DEFAULT_TAG }}
          RELEASE_KIND: ${{ steps.version.outputs.release_kind }}
          CHANNEL: ${{ steps.version.outputs.channel }}
          VERSION_LABEL: ${{ steps.version.outputs.version_label }}
          SEMVER_TAG: ${{ steps.version.outputs.semver_tag }}
          SEMVER_NUM: ${{ steps.version.outputs.semver_num }}
          SHORT_SHA: ${{ steps.version.outputs.short_sha }}
          DATE_UTC: ${{ steps.version.outputs.date_utc }}
          DIGEST: ${{ steps.push-image.outputs.digest }}
          DIGEST_TAG: ${{ steps.push-image.outputs.digest_tag }}
          REF_NAME: ${{ github.ref_name }}
          BASE_IMAGE: ${{ steps.version.outputs.base_image }}
        run: |
          set -euo pipefail
          IMG="${IMAGE_NAME}:sha-${SHORT_SHA}"
          if ! podman image exists "${IMG}" 2>/dev/null; then
            IMG="${IMAGE_NAME}:${DIGEST_TAG:-${DEFAULT_TAG}}"
          fi

          BASE_OS_PRETTY=$(podman run --rm --entrypoint /bin/sh "${IMG}" -lc '. /usr/lib/os-release 2>/dev/null; echo "${PRETTY_NAME:-unknown}"' | head -n1)
          BASE_OS_VERSION=$(podman run --rm --entrypoint /bin/sh "${IMG}" -lc '. /usr/lib/os-release 2>/dev/null; echo "${VERSION_ID:-${VERSION:-unknown}}"' | head -n1)
          SURFACE_PKGS=$(podman run --rm --entrypoint /bin/sh "${IMG}" -lc '
            for p in kernel-surface iptsd libwacom-surface surface-control surface-dtx-daemon; do
              printf "%s=%s\n" "$p" "$(rpm -q "$p" --qf "%{VERSION}-%{RELEASE}" 2>/dev/null || echo unknown)"
            done
            printf "sdx-control-centre=%s\n" "$(rpm -q sdx-control-centre --qf "%{VERSION}" 2>/dev/null || echo unknown)"
          ' || true)
          pkg_version() {
            local value
            value="$(printf '%s\n' "${SURFACE_PKGS}" | sed -n "s|^$1=||p" | head -n1)"
            printf '%s' "${value:-unknown}"
          }
          SURFACE_KERNEL="$(pkg_version kernel-surface)"
          IPTSD="$(pkg_version iptsd)"
          LIBWACOM_SURFACE="$(pkg_version libwacom-surface)"
          SURFACE_CONTROL="$(pkg_version surface-control)"
          SURFACE_DTX_DAEMON="$(pkg_version surface-dtx-daemon)"
          SDX_VERSION="$(pkg_version sdx-control-centre)"

          BAZZITE_VERSION="unknown"
          BAZZITE_DIGEST=""
          if ! command -v skopeo >/dev/null 2>&1; then sudo apt-get update -qq && sudo apt-get install -y -qq skopeo >/dev/null || true; fi
          if command -v skopeo >/dev/null 2>&1; then
            BAZZITE_VERSION=$(skopeo inspect "docker://${BASE_IMAGE}" 2>/dev/null | jq -r '.Labels["org.opencontainers.image.version"] // .Labels["version"] // "unknown"' | head -n1)
            BAZZITE_DIGEST=$(skopeo inspect "docker://${BASE_IMAGE}" 2>/dev/null | jq -r '.Digest // ""' | head -n1)
          fi
          if [[ -z "${BAZZITE_VERSION}" || "${BAZZITE_VERSION}" == "null" ]]; then BAZZITE_VERSION="unknown"; fi
          if [[ -z "${BAZZITE_DIGEST}" || "${BAZZITE_DIGEST}" == "null" ]]; then BAZZITE_DIGEST="unknown"; fi

          MARK_LATEST=false
          PRERELEASE=false
          TAG=""
          TITLE=""
          CHANNEL_NOTE=""
          PRIMARY_IMAGE=""

          if [[ "${RELEASE_KIND}" == "stable" ]]; then
            TAG="stable"
            DISPLAY_VERSION="${BAZZITE_VERSION}"
            TITLE="Bazzite-SDX ${DISPLAY_VERSION} (Stable)"
            PRIMARY_IMAGE="ghcr.io/nexgen-3d-printing/bazzite-sdx:stable"
            CHANNEL_NOTE="Stable channel build from \`ghcr.io/ublue-os/bazzite-dx:stable\`. Built automatically when upstream changes are detected in Bazzite-DX Stable, linux-surface packages, or SDX Control Centre. This channel was formerly published as \`latest\`; it is now \`stable\` (hard rename)."
          elif [[ "${RELEASE_KIND}" == "testing" ]]; then
            TAG="testing"
            DISPLAY_VERSION="${BAZZITE_VERSION}"
            TITLE="Bazzite-SDX ${DISPLAY_VERSION} (Testing)"
            PRERELEASE=false
            PRIMARY_IMAGE="ghcr.io/nexgen-3d-printing/bazzite-sdx:testing"
            CHANNEL_NOTE="Testing channel build from \`ghcr.io/ublue-os/bazzite-dx:testing\`. Built automatically when upstream changes are detected in Bazzite-DX Testing, linux-surface packages, or SDX Control Centre. Use for validation before relying on stable."
          elif [[ "${RELEASE_KIND}" == "unstable" ]]; then
            TAG="unstable"
            DISPLAY_VERSION="unstable-${DATE_UTC}-${SHORT_SHA}"
            TITLE="Bazzite-SDX (Unstable)"
            PRERELEASE=false
            PRIMARY_IMAGE="ghcr.io/nexgen-3d-printing/bazzite-sdx:unstable"
            CHANNEL_NOTE="Manual unstable build from \`ghcr.io/ublue-os/bazzite-dx:unstable\`. Published only when explicitly triggered. Does not update \`stable\` or \`testing\`. Use for investigation; expect breakage."
          elif [[ "${RELEASE_KIND}" == "semver" ]]; then
            TAG="${SEMVER_TAG}"
            DISPLAY_VERSION="${SEMVER_TAG}"
            TITLE="Bazzite-SDX ${SEMVER_TAG}"
            PRIMARY_IMAGE="ghcr.io/nexgen-3d-printing/bazzite-sdx:${SEMVER_TAG}"
            CHANNEL_NOTE="Explicit SemVer release (pinned). Source of truth: git tag + \`VERSION\`."
          else
            echo "No release update for ${RELEASE_KIND}"
            exit 0
          fi

          {
