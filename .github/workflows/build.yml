---
name: Build container image
on:
  pull_request:
    branches:
      - main
  schedule:
    # Weekly automatic build (publishes :latest) - Monday 12:00 PM AWST (UTC+8)
    - cron: '0 4 * * 1'  # Monday 04:00 UTC / 12:00 PM AWST
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      unstable:
        description: 'Build and publish unstable tags (use when running from experimental). Does not update latest/testing.'
        required: false
        type: boolean
        default: false

env:
  IMAGE_REGISTRY: "ghcr.io/nexgen-3d-printing"  # do not edit

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}-${{ inputs.brand_name}}-${{ inputs.stream_name }}
  cancel-in-progress: true

jobs:
  build_push:
    name: Build and push image
    runs-on: ubuntu-26.04

    permissions:
      contents: write
      packages: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Maximize build space
        uses: ublue-os/remove-unwanted-software@695eb75bc387dbcd9685a8e72d23439d8686cba6

      - name: Load environment
        id: load-env
        run: |
          if [ -f image-template.env ]; then
            set -a
            source image-template.env
            set +a
          fi
          echo "IMAGE_NAME=${IMAGE_NAME%%[[:space:]]*}" >> ${GITHUB_ENV}
          echo "REPO_ORGANIZATION=${REPO_ORGANIZATION%%[[:space:]]*}" >> ${GITHUB_ENV}
          echo "IMAGE_DESC=${IMAGE_DESC%%[[:space:]]*}" >> ${GITHUB_ENV}
          echo "DEFAULT_TAG=${DEFAULT_TAG%%[[:space:]]*}" >> ${GITHUB_ENV}
          printf "IMAGE_NAME=%s\n" "${IMAGE_NAME%%[[:space:]]*}" > ${GITHUB_OUTPUT}
          printf "REPO_ORGANIZATION=%s\n" "${REPO_ORGANIZATION%%[[:space:]]*}" >> ${GITHUB_OUTPUT}
          printf "IMAGE_DESC=%s\n" "${IMAGE_DESC%%[[:space:]]*}" >> ${GITHUB_OUTPUT}
          printf "DEFAULT_TAG=%s\n" "${DEFAULT_TAG%%[[:space:]]*}" >> ${GITHUB_OUTPUT}

      - name: Resolve channel, version, and publish settings
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          UNSTABLE_INPUT: ${{ inputs.unstable && 'true' || 'false' }}
        run: |
          set -euo pipefail
          SHORT_SHA="${SHA:0:7}"
          DATE_UTC="$(date -u +%Y%m%d)"
          FILE_VERSION="$(tr -d '[:space:]' < VERSION 2>/dev/null || echo 0.0.0)"
          CHANNEL=""
          PUBLISH=false
          VERSION_LABEL=""
          RELEASE_KIND="none"   # weekly|testing|semver|unstable|none
          SEMVER_TAG=""
          SEMVER_NUM=""

          if [[ "${EVENT_NAME}" == "pull_request" ]]; then
            CHANNEL="pr"
            PUBLISH=false
            VERSION_LABEL="pr-${SHORT_SHA}"
            RELEASE_KIND="none"
          elif [[ "${REF}" == refs/tags/v* ]]; then
            SEMVER_TAG="${REF_NAME}"
            if [[ "${SEMVER_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              SEMVER_NUM="${SEMVER_TAG#v}"
              if [[ "${FILE_VERSION}" != "${SEMVER_NUM}" ]]; then
                echo "::error::VERSION file (${FILE_VERSION}) does not match tag ${SEMVER_TAG} (expected ${SEMVER_NUM})"
                exit 1
              fi
              CHANNEL="semver"
              PUBLISH=true
              VERSION_LABEL="${SEMVER_TAG}"
              RELEASE_KIND="semver"
            else
              echo "::error::Unsupported tag format '${SEMVER_TAG}'. Use SemVer tags like v0.1.0."
              exit 1
            fi
          elif [[ "${EVENT_NAME}" == "schedule" ]]; then
            # Automatic weekly build -> latest
            CHANNEL="weekly"
            PUBLISH=true
            VERSION_LABEL="weekly-${DATE_UTC}+${SHORT_SHA}"
            RELEASE_KIND="weekly"
          elif [[ "${EVENT_NAME}" == "workflow_dispatch" && ( "${UNSTABLE_INPUT}" == "true" || "${REF_NAME}" == "experimental" ) ]]; then
            # Manual unstable build (typically from experimental). Publishes :unstable tags; does not update latest/testing.
            CHANNEL="unstable"
            PUBLISH=true
            VERSION_LABEL="unstable-${DATE_UTC}+${SHORT_SHA}"
            RELEASE_KIND="unstable"
          elif [[ "${EVENT_NAME}" == "push" || "${EVENT_NAME}" == "workflow_dispatch" ]]; then
            # Any build that is not the automatic weekly build -> testing
            CHANNEL="testing"
            PUBLISH=true
            VERSION_LABEL="testing-${DATE_UTC}+${SHORT_SHA}"
            RELEASE_KIND="testing"
          else
            CHANNEL="testing"
            PUBLISH=true
            VERSION_LABEL="testing-${DATE_UTC}+${SHORT_SHA}"
            RELEASE_KIND="testing"
          fi

          {
            echo "channel=${CHANNEL}"
            echo "publish=${PUBLISH}"
            echo "version_label=${VERSION_LABEL}"
            echo "release_kind=${RELEASE_KIND}"
            echo "semver_tag=${SEMVER_TAG}"
            echo "semver_num=${SEMVER_NUM}"
            echo "short_sha=${SHORT_SHA}"
            echo "date_utc=${DATE_UTC}"
            echo "file_version=${FILE_VERSION}"
          } >> "$GITHUB_OUTPUT"

      - name: Debug environment
        env:
          CHANNEL: ${{ steps.version.outputs.channel }}
          PUBLISH: ${{ steps.version.outputs.publish }}
          VERSION_LABEL: ${{ steps.version.outputs.version_label }}
          RELEASE_KIND: ${{ steps.version.outputs.release_kind }}
          SEMVER_TAG: ${{ steps.version.outputs.semver_tag }}
        run: |
          echo "=== Environment Variables ==="
          echo "IMAGE_NAME=${{ steps.load-env.outputs.IMAGE_NAME }}"
          echo "REPO_ORGANIZATION=${{ steps.load-env.outputs.REPO_ORGANIZATION }}"
          echo "IMAGE_DESC=${{ steps.load-env.outputs.IMAGE_DESC }}"
          echo "DEFAULT_TAG=${{ steps.load-env.outputs.DEFAULT_TAG }}"
          echo "CHANNEL=${CHANNEL}"
          echo "PUBLISH=${PUBLISH}"
          echo "VERSION_LABEL=${VERSION_LABEL}"
          echo "RELEASE_KIND=${RELEASE_KIND}"
          echo "SEMVER_TAG=${SEMVER_TAG}"

      - name: Verify GHCR write access
        if: steps.version.outputs.publish == 'true'
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
          IMAGE_NAME: ${{ steps.load-env.outputs.IMAGE_NAME }}
        run: |
          set -euo pipefail
          REPO="${IMAGE_REGISTRY#ghcr.io/}/${IMAGE_NAME}"
          REPO="$(echo "${REPO}" | tr '[:upper:]' '[:lower:]')"
          echo "Checking write access to ghcr.io/${REPO}"
          TOKEN=$(curl -fsS -u "${GHCR_USER}:${GHCR_TOKEN}" \
            "https://ghcr.io/token?service=ghcr.io&scope=repository:${REPO}:push,pull" \
            | jq -r '.token')
          HEADERS=$(mktemp)
          BODY=$(mktemp)
          CODE=$(curl -sS -o "${BODY}" -D "${HEADERS}" -w '%{http_code}' \
            -X POST \
            -H "Authorization: Bearer ${TOKEN}" \
            "https://ghcr.io/v2/${REPO}/blobs/uploads/")
          echo "POST /v2/${REPO}/blobs/uploads/ -> HTTP ${CODE}"
          if [ "${CODE}" = "202" ]; then
            LOCATION=$(grep -i '^location:' "${HEADERS}" | cut -d' ' -f2 | tr -d '\r' || true)
            if [ -n "${LOCATION}" ]; then
              curl -sS -o /dev/null -X DELETE -H "Authorization: Bearer ${TOKEN}" "${LOCATION}" || true
            fi
            exit 0
          fi
          cat "${BODY}"
          echo "::error::GITHUB_TOKEN cannot write to ghcr.io/${REPO} (HTTP ${CODE})."
          exit 1

      - name: Build Image
        id: build-image
        env:
          IMAGE_NAME: ${{ steps.load-env.outputs.IMAGE_NAME }}
          REPO_ORGANIZATION: ${{ steps.load-env.outputs.REPO_ORGANIZATION }}
          IMAGE_DESC: ${{ steps.load-env.outputs.IMAGE_DESC }}
          DEFAULT_TAG: ${{ steps.load-env.outputs.DEFAULT_TAG }}
          VERSION_LABEL: ${{ steps.version.outputs.version_label }}
        run: |
          set -euox pipefail
          LABELS=(
            "--label" "io.artifacthub.package.deprecated=false"
            "--label" "org.opencontainers.image.title=${IMAGE_NAME}"
            "--label" "org.opencontainers.image.description=${IMAGE_DESC}"
            "--label" "org.opencontainers.image.vendor=${REPO_ORGANIZATION}"
            "--label" "org.opencontainers.image.version=${VERSION_LABEL}"
            "--label" "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}"
            "--label" "org.opencontainers.image.revision=${GITHUB_SHA}"
          )
          podman build "${LABELS[@]}" --pull=newer --tag "${IMAGE_NAME}:${DEFAULT_TAG}" --file Containerfile .

      - name: Rechunk with rpm-ostree
        id: rechunk
        env:
          IMAGE_NAME: ${{ steps.load-env.outputs.IMAGE_NAME }}
          DEFAULT_TAG: ${{ steps.load-env.outputs.DEFAULT_TAG }}
        run: |
          IMAGE=$(podman inspect "${IMAGE_NAME}:${DEFAULT_TAG}" | jq -r '.[0].Id')
          podman untag "${IMAGE}"
          podman tag "${IMAGE}" "${IMAGE_NAME}:${DEFAULT_TAG}"
          podman images

      - name: Generate Build Tags
        id: gen-build-tags
        env:
          CHANNEL: ${{ steps.version.outputs.channel }}
          SEMVER_TAG: ${{ steps.version.outputs.semver_tag }}
          SEMVER_NUM: ${{ steps.version.outputs.semver_num }}
          SHORT_SHA: ${{ steps.version.outputs.short_sha }}
          DATE_UTC: ${{ steps.version.outputs.date_utc }}
        run: |
          set -euo pipefail
          BUILD_TAGS=()
          case "${CHANNEL}" in
            weekly)
              # Automatic weekly build -> latest
              BUILD_TAGS+=("latest")
              BUILD_TAGS+=("weekly")
              BUILD_TAGS+=("weekly-${DATE_UTC}")
              BUILD_TAGS+=("sha-${SHORT_SHA}")
              ;;
            testing)
              # Any build that is not the automatic weekly build -> testing
              BUILD_TAGS+=("testing")
              BUILD_TAGS+=("testing-${DATE_UTC}")
              BUILD_TAGS+=("sha-${SHORT_SHA}")
              ;;
            unstable)
              # Manual experimental/unstable build (typically from experimental branch)
              BUILD_TAGS+=("unstable")
              BUILD_TAGS+=("unstable-${DATE_UTC}")
              BUILD_TAGS+=("sha-${SHORT_SHA}")
              ;;
            semver)
              # Explicit pinned SemVer release (coexists with weekly/testing channels)
              MINOR="${SEMVER_NUM%.*}"
              BUILD_TAGS+=("${SEMVER_TAG}")
              BUILD_TAGS+=("v${MINOR}")
              BUILD_TAGS+=("sha-${SHORT_SHA}")
              ;;
            *)
              BUILD_TAGS+=("sha-${SHORT_SHA}")
              ;;
          esac
          echo "Tags for this Action..."
          echo "${BUILD_TAGS[@]}"
          echo "alias_tags=${BUILD_TAGS[@]}" >> "$GITHUB_OUTPUT"

      - name: Tag Image
        id: tag-images
        env:
          IMAGE_NAME: ${{ steps.load-env.outputs.IMAGE_NAME }}
          DEFAULT_TAG: ${{ steps.load-env.outputs.DEFAULT_TAG }}
          ALIAS_TAGS: ${{ steps.gen-build-tags.outputs.alias_tags }}
        run: |
          set -euo pipefail
          IMAGE=$(podman inspect "${IMAGE_NAME}:${DEFAULT_TAG}" | jq -r '.[0].Id')
          podman untag "${IMAGE}"
          for tag in ${ALIAS_TAGS}; do
            podman tag "${IMAGE}" "${IMAGE_NAME}:${tag}"
          done
          podman images

      - name: Login to GitHub Container Registry (docker config)
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        if: steps.version.outputs.publish == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to GitHub Container Registry (podman)
        if: steps.version.outputs.publish == 'true'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | podman login ghcr.io -u "${{ github.repository_owner }}" --password-stdin

      - name: Push To GHCR
        if: steps.version.outputs.publish == 'true'
        id: push-image
        env:
          IMAGE_NAME: ${{ steps.load-env.outputs.IMAGE_NAME }}
          ALIAS_TAGS: ${{ steps.gen-build-tags.outputs.alias_tags }}
          CHANNEL: ${{ steps.version.outputs.channel }}
          SEMVER_TAG: ${{ steps.version.outputs.semver_tag }}
        run: |
          set -euo pipefail
          echo "DEBUG: ALIAS_TAGS=${ALIAS_TAGS}"
          PRIMARY_DIGEST_TAG="testing"
          if [[ "${CHANNEL}" == "weekly" ]]; then PRIMARY_DIGEST_TAG="latest"; fi
          if [[ "${CHANNEL}" == "unstable" ]]; then PRIMARY_DIGEST_TAG="unstable"; fi
          if [[ "${CHANNEL}" == "semver" && -n "${SEMVER_TAG}" ]]; then PRIMARY_DIGEST_TAG="${SEMVER_TAG}"; fi
          for tag in ${ALIAS_TAGS}; do
            DESTINATION="${IMAGE_REGISTRY}/${IMAGE_NAME}:${tag}"
            echo "DEBUG: Pushing ${IMAGE_NAME}:${tag} to ${DESTINATION}"
            podman push --digestfile=/tmp/digestfile "${IMAGE_NAME}:${tag}" "docker://${DESTINATION}"
            if [[ "${tag}" == "${PRIMARY_DIGEST_TAG}" ]]; then
              cp /tmp/digestfile /tmp/primary-digestfile
            fi
          done
          if [[ -f /tmp/primary-digestfile ]]; then
            digest=$(< /tmp/primary-digestfile)
          else
            digest=$(< /tmp/digestfile)
          fi
          echo "Digest=${digest}" >> $GITHUB_OUTPUT
          echo "digest_tag=${PRIMARY_DIGEST_TAG}" >> $GITHUB_OUTPUT

      - name: Install cosign
        if: steps.version.outputs.publish == 'true'
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: v2.6.1

      - name: Sign container image
        if: steps.version.outputs.publish == 'true'
        id: sign
        env:
          DIGEST: ${{ steps.push-image.outputs.digest }}
          IMAGE_NAME: ${{ steps.load-env.outputs.IMAGE_NAME }}
          COSIGN_PASSWORD: ""
        run: |
          set -euo pipefail
          KEY_FILE=$(mktemp)
          trap 'rm -f "${KEY_FILE}"' EXIT
          printf '%s\n' "${{ secrets.COSIGN_PRIVATE_KEY }}" > "${KEY_FILE}"
          cosign sign --yes --key "${KEY_FILE}" "${IMAGE_REGISTRY}/${IMAGE_NAME}@${DIGEST}"

      - name: Update GitHub Release
        if: steps.version.outputs.release_kind != 'none' && steps.version.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_NAME: ${{ steps.load-env.outputs.IMAGE_NAME }}
          DEFAULT_TAG: ${{ steps.load-env.outputs.DEFAULT_TAG }}
          RELEASE_KIND: ${{ steps.version.outputs.release_kind }}
          CHANNEL: ${{ steps.version.outputs.channel }}
          VERSION_LABEL: ${{ steps.version.outputs.version_label }}
          SEMVER_TAG: ${{ steps.version.outputs.semver_tag }}
          SEMVER_NUM: ${{ steps.version.outputs.semver_num }}
          SHORT_SHA: ${{ steps.version.outputs.short_sha }}
          DATE_UTC: ${{ steps.version.outputs.date_utc }}
          DIGEST: ${{ steps.push-image.outputs.digest }}
          DIGEST_TAG: ${{ steps.push-image.outputs.digest_tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # Use a locally tagged image (sha tag is always published). DEFAULT_TAG may not
          # be present locally for testing/semver builds because Tag Image only keeps ALIAS_TAGS.
          IMG="${IMAGE_NAME}:sha-${SHORT_SHA}"
          if ! podman image exists "${IMG}" 2>/dev/null; then
            IMG="${IMAGE_NAME}:${DIGEST_TAG:-${DEFAULT_TAG}}"
          fi

          BASE_OS_PRETTY=$(podman run --rm --entrypoint /bin/sh "${IMG}" -lc '. /usr/lib/os-release 2>/dev/null; echo "${PRETTY_NAME:-unknown}"' | head -n1)
          BASE_OS_VERSION=$(podman run --rm --entrypoint /bin/sh "${IMG}" -lc '. /usr/lib/os-release 2>/dev/null; echo "${VERSION_ID:-${VERSION:-unknown}}"' | head -n1)
          BASE_OS_NAME=$(podman run --rm --entrypoint /bin/sh "${IMG}" -lc '. /usr/lib/os-release 2>/dev/null; echo "${NAME:-unknown}"' | head -n1)
          SURFACE_KERNEL=$(podman run --rm --entrypoint /bin/sh "${IMG}" -lc 'rpm -q kernel-surface --qf "%{VERSION}-%{RELEASE}" 2>/dev/null || echo unknown' | head -n1)

          # Determine display version for rolling channels (Vx.y.z)
          # - testing: increments patch from last known testing/latest display version
          # - weekly/latest: takes current testing display version (so latest matches testing)
          DISPLAY_VERSION=""
          BASE_VER=""
          for rel in testing latest; do
            NAME_RAW="$(gh release view "$rel" --json name -q .name 2>/dev/null || true)"
            if [[ "$NAME_RAW" =~ [Vv]([0-9]+)\.([0-9]+)\.([0-9]+) ]]; then
              BASE_VER="V${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.${BASH_REMATCH[3]}"
              break
            fi
          done
          [[ -z "$BASE_VER" ]] && BASE_VER="V1.0.0"

          bump_patch() {
            local v="${1#V}"; v="${v#v}"
            local maj min pat
            IFS=. read -r maj min pat <<< "$v"
            echo "V${maj}.${min}.$((pat + 1))"
          }

          if [[ "${RELEASE_KIND}" == "weekly" ]]; then
            DISPLAY_VERSION="$BASE_VER"
            TAG="latest"
            TITLE="Bazzite-SDX ${DISPLAY_VERSION} (Latest Weekly)"
            MARK_LATEST=true
            PRERELEASE=false
            PRIMARY_IMAGE="ghcr.io/nexgen-3d-printing/bazzite-sdx:latest"
            CHANNEL_NOTE="Automatic weekly build. \`latest\` tracks the newest weekly build and takes the current testing display version at build time. Commit/change builds (non-weekly) publish \`testing\` tags with an incremented display version."
          elif [[ "${RELEASE_KIND}" == "testing" ]]; then
            DISPLAY_VERSION="$(bump_patch "$BASE_VER")"
            TAG="testing"
            TITLE="Bazzite-SDX ${DISPLAY_VERSION} (Testing)"
            MARK_LATEST=false
            PRERELEASE=true
            PRIMARY_IMAGE="ghcr.io/nexgen-3d-printing/bazzite-sdx:testing"
            CHANNEL_NOTE="Testing channel build (not the automatic weekly build). Published from \`${REF_NAME}\` / ${SHORT_SHA}. Display version increments on each testing build; the weekly/latest build takes the current testing display version. Use for validation."
          elif [[ "${RELEASE_KIND}" == "unstable" ]]; then
            DISPLAY_VERSION="Unstable ${DATE_UTC}-${SHORT_SHA}"
            TAG="unstable"
            TITLE="Bazzite-SDX (Unstable / Experimental)"
            MARK_LATEST=false
            PRERELEASE=true
            PRIMARY_IMAGE="ghcr.io/nexgen-3d-printing/bazzite-sdx:unstable"
            CHANNEL_NOTE="Manual unstable/experimental build (typically from \`${REF_NAME}\`). Published only when explicitly triggered. Does not update \`latest\` or \`testing\`. Use for investigation; expect breakage."
          elif [[ "${RELEASE_KIND}" == "semver" ]]; then
            DISPLAY_VERSION="${SEMVER_TAG}"
            TAG="${SEMVER_TAG}"
            TITLE="Bazzite-SDX ${SEMVER_TAG}"
            MARK_LATEST=false
            PRERELEASE=false
            PRIMARY_IMAGE="ghcr.io/nexgen-3d-printing/bazzite-sdx:${SEMVER_TAG}"
            CHANNEL_NOTE="Explicit SemVer release (coexists with weekly \`latest\` and \`testing\` channels). \`latest\` continues to track weekly builds."
          else
            echo "No release update for ${RELEASE_KIND}"
            exit 0
          fi

          {
            echo "# ${DISPLAY_VERSION}"
            echo ""
            echo "## ${TITLE}"
            echo ""
            echo "Bazzite-DX with Linux Surface kernel support."
            echo ""
            echo "${CHANNEL_NOTE}"
            echo ""
            echo "### Versions / Image info"
            echo "- **Display version:** \`${DISPLAY_VERSION}\`"
            echo "- **Channel:** ${CHANNEL}"
            echo "- **Build version:** \`${VERSION_LABEL}\`"
            if [[ "${RELEASE_KIND}" == "semver" ]]; then echo "- **SemVer tag:** \`${SEMVER_TAG}\` (source of truth: git tag + \`VERSION\`)"; fi
            echo "- **Bazzite/base OS:** ${BASE_OS_PRETTY} (VERSION_ID: ${BASE_OS_VERSION})"
            echo "- **Surface kernel:** ${SURFACE_KERNEL}"
            echo "- **Image digest:** \`${DIGEST}\`"
            echo "- **Primary image:** \`${PRIMARY_IMAGE}\`"
            echo "- **Weekly/latest:** \`ghcr.io/nexgen-3d-printing/bazzite-sdx:latest\`"
            echo "- **Testing:** \`ghcr.io/nexgen-3d-printing/bazzite-sdx:testing\`"
            echo ""
            echo "### NexGen3D SDX Portal"
            echo "The image includes **NexGen3D SDX Portal**, a separate yafti-based portal alongside the original Bazzite Portal. It provides category tabs, per-app install actions, and full app descriptions, and runs Bazzite-SDX \`ujust\` recipes (apps are **not baked into the OS image**). Flatpak apps install **per user** (Bazzite-style, no sudo required for app installs). NexGen3D SDX Portal is configured to launch on first boot; Steam autostart is disabled by default in Bazzite-SDX."
            echo ""
            echo "**Launch:** open \`NexGen3D SDX Portal\` from the app menu (or run \`yafti_gtk.py /usr/share/yafti/nexgen3d-sdx.yml\`)."
            echo ""
            echo "**Portal features:**"
            echo "- Separate from the upstream Bazzite Portal (configured to launch on first boot)"
            echo "- Category tabs: Setup, AI Tools, Web Browsers, Creative Utilities, System Utilities, Media, System Management"
            echo "- Per-app install options with full descriptions and source/install-method notes"
            echo "- \"Install all core apps\" option + per-app \`ujust\` recipes"
            echo "- System actions: check for updates (prompt before \`ujust update\`), switch channels/versions via bootc (\`latest\` weekly, \`testing\`, or specific SemVer/tag), run \`ujust benchmark\` (if available), show system info via \`fastfetch\`"
            echo ""
            echo "**Apps included / available via portal (install priority: Flatpak > AppImage > rpm-ostree layer > Docker, as applicable):**"
            echo "- **AI Tools:** OpenCode desktop app (upstream AppImage integrated via Gear Lever, with stable/pre-release install options and GitHub update source), OpenCode CLI (official user installer), LM Studio (\`ai.lmstudio.lm-studio\`, user Flatpak/Flathub), Unsloth Desktop (AppImage, user install with stable/pre-release options), ArtCraft (upstream Flatpak bundle from \`storytold/artcraft\`, user install with stable/pre-release options; **warning:** requires an account and may require a subscription for some features/services), Craft Anything (upstream Flatpak bundle from \`storytold/craft-anything\`, user install with stable/pre-release options), REA / \`rea-agents\` (\`morluto/rea\`, user-local npm/npx CLI/MCP setup; requires supported Node.js/npm), Harbor (\`av/harbor\`, Docker/Compose setup), Odysseus (\`odysseus-dev/odysseus\`, Docker/Compose setup)"
            echo "- **Web Browsers:** Brave Browser (\`com.brave.Browser\`, user Flatpak/Flathub)"
            echo "- **Creative Utilities:** SolidCraft (\`io.tangencylabs.solidcraft\`, user Flatpak via SolidCraft repo), PhotoCraft (upstream Flatpak bundle from \`storytold/photocraft\`, user install with stable/pre-release options), PDFCraft (upstream Flatpak bundle from \`storytold/pdfcraft\`, user install with stable/pre-release options)"
            echo "- **System Utilities:** Mission Center (\`io.missioncenter.MissionCenter\`, user Flatpak/Flathub), Gear Lever (\`it.mijorus.gearlever\`, user Flatpak/Flathub)"
            echo "- **Media:** Plex Player/Plex Desktop (\`tv.plex.PlexDesktop\`, user Flatpak/Flathub), Plex HTPC (\`tv.plex.PlexHTPC\`, user Flatpak/Flathub), VLC (\`org.videolan.VLC\`, user Flatpak/Flathub), Delfin (\`cafe.avery.Delfin\`, user Flatpak/Flathub), Web App Hub (\`org.pvermeer.WebAppHub\`, user Flatpak/Flathub)"
            echo ""
            echo "### Quick install (core Bazzite-SDX apps)"
            echo "After rebasing, install the core curated app set with:"
            echo '```bash'
            echo "ujust install-bazzite-sdx-flatpaks"
            echo '```'
            echo "Or use **NexGen3D SDX Portal** for per-app installs and additional tools."
            echo ""
            echo "### Channels, switching & rollback (bootc)"
            if [[ "${RELEASE_KIND}" == "testing" ]]; then
              echo "- **Testing (this channel, non-weekly commit/manual builds):** \`sudo bootc switch ghcr.io/nexgen-3d-printing/bazzite-sdx:testing\`"
              echo "- **Weekly/latest (takes current testing display version on each weekly build):** \`sudo bootc switch ghcr.io/nexgen-3d-printing/bazzite-sdx:latest\`"
              echo "- **Pinned SemVer/specific tag (rollback or pin):** \`sudo bootc switch ghcr.io/nexgen-3d-printing/bazzite-sdx:vX.Y.Z\` (replace with a published tag)"
              echo "- **Previous deployment rollback:** after rebooting into a bad deployment, \`sudo bootc rollback\` can revert to the previous deployment (different from switching to an arbitrary tag)."
              echo "- **Portal:** NexGen3D SDX Portal → **System Management** includes actions to switch channels/versions (with confirmation; reboot required)."
            elif [[ "${RELEASE_KIND}" == "semver" ]]; then
              echo "- **Pinned SemVer release (this tag):** \`sudo bootc switch ghcr.io/nexgen-3d-printing/bazzite-sdx:${SEMVER_TAG}\`"
              echo "- **Pinned SemVer/specific tag (rollback or pin):** \`sudo bootc switch ghcr.io/nexgen-3d-printing/bazzite-sdx:vX.Y.Z\` (replace with a published tag)"
