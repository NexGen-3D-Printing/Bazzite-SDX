--- 

name: Build Live ISO

on:
  workflow_dispatch:
    inputs:
      platform:
        required: true
        type: choice
        options:
          - amd64
          - arm64

env:
  IMAGE_NAME: ${{ github.event.repository.name }}
  IMAGE_REGISTRY: "ghcr.io/${{ github.repository_owner }}"
  DEFAULT_TAG: "stable"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build-iso:
    name: Build ISO
    runs-on: ${{ inputs.platform == 'amd64' && 'ubuntu-26.04' || 'ubuntu-26.04-arm' }}
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Prepare environment
        run: |
          USER_UID=$(id -u)
          USER_GID=$(id -g)
          echo "IMAGE_REGISTRY=${IMAGE_REGISTRY,,}" >> ${GITHUB_ENV}
          echo "IMAGE_NAME=${IMAGE_NAME,,}" >> ${GITHUB_ENV}
          echo "USER_UID=${USER_UID}" >> ${GITHUB_ENV}
          echo "USER_GID=${USER_GID}" >> ${GITHUB_ENV}

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup podman
        run: |
          sudo apt-get update -y
          sudo apt-get install -y podman
          podman login -u "${{ github.actor }}" -p "${{ secrets.GITHUB_TOKEN }}" ghcr.io

      - name: Pull source image
        run: |
          sudo podman pull ${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.DEFAULT_TAG }}

      - name: Create ISO payload container
        run: |
          # Create a new container from the source image with ISO setup
          sudo podman run --rm \
            --privileged \
            ${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.DEFAULT_TAG }} \
            bash -c "dnf install -y grub2-efi-x64-cdboot && mkdir -p /boot/efi/EFI && cp -av /usr/lib/efi/shim/*/EFI/* /boot/efi/EFI/"

      - name: Build ISO with bootc-image-builder
        id: build
        run: |
          # Build ISO from the source image
          sudo podman run --rm -i \
            --privileged \
            -v /var/lib/containers/storage:/var/lib/containers/storage \
            -v "${{ github.workspace }}":/output \
            quay.io/centos-bootc/bootc-image-builder:latest \
            build --type iso --output /output ${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.DEFAULT_TAG }}

      - name: Generate SHA256 checksum
        shell: bash
        run: |
          ISO_PATH="${{ github.workspace }}/bazzite-sdx-${{ env.DEFAULT_TAG }}-amd64.iso"
          if [[ -f "$ISO_PATH" ]]; then
            sha256sum "$ISO_PATH" > "${ISO_PATH}.sha256"
          fi

      - name: Upload ISO artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: "*.iso"
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
          overwrite: true

      - name: Upload Checksum artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: "*.sha256"
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
          overwrite: true
