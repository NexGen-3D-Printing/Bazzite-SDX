--- 

name: Build Live ISO

on:
  workflow_dispatch:
    inputs:
      upload-to-s3:
        description: "Upload to S3"
        required: false
        default: false
        type: boolean
      platform:
        required: true
        type: choice
        options:
          - amd64
          - arm64
      tag:
        description: "Git tag for release (e.g., v1.0.0 or 20261107)"
        required: true
        default: "20261107"
  pull_request:
    branches:
      - main
    paths:
      - './disk_config/iso.toml'
      - './system_files/iso.yaml'
      - './.github/workflows/build-iso.yml'

env:
  IMAGE_NAME: ${{ github.event.repository.name }} # output of build.yml, keep in sync
  IMAGE_REGISTRY: "ghcr.io/${{ github.repository_owner }}"
  DEFAULT_TAG: "stable"
  TITANOBOA_IMAGE: "ghcr.io/ublue-os/titanoboa:main"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build-iso:
    name: Build ISO
    runs-on: ${{ inputs.platform == 'amd64' && 'ubuntu-26.04' || 'ubuntu-26.04-arm' }}
    permissions:
      contents: write
      packages: read
      id-token: write

    steps:
      - name: Prepare environment
        run: |
          USER_UID=$(id -u)
          USER_GID=$(id -g)
          echo "IMAGE_REGISTRY=${IMAGE_REGISTRY,,}" >> ${GITHUB_ENV}
          echo "IMAGE_NAME=${IMAGE_NAME,,}" >> ${GITHUB_ENV}
          echo "USER_UID=${USER_UID}" >> ${GITHUB_ENV}
          echo "USER_GID=${USER_GID}" >> ${GITHUB_ENV}

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Build ISO with Titanoboa
        id: build
        uses: ublue-os/titanoboa@main
        with:
          image-ref: ${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.DEFAULT_TAG }}
          iso-dest: bazzite-sdx-${{ env.DEFAULT_TAG }}-amd64.iso

      - name: Generate SHA256 checksum
        shell: bash
        run: |
          cd $(dirname "${{ steps.build.outputs.iso-dest }}")
          sha256sum $(basename "${{ steps.build.outputs.iso-dest }}") > $(basename "${{ steps.build.outputs.iso-dest }}").sha256

      - name: Upload ISO and Checksum
        if: inputs.upload-to-s3 != true && github.event_name != 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: ${{ steps.build.outputs.iso-dest }}
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
          overwrite: true

      - name: Upload ISO Checksum
        if: inputs.upload-to-s3 != true && github.event_name != 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: ${{ steps.build.outputs.iso-dest }}.sha256
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
          overwrite: true

      - name: Upload to S3
        if: inputs.upload-to-s3 == true && github.event_name != 'pull_request'
        shell: bash
        env:
          RCLONE_CONFIG_S3_TYPE: s3
          RCLONE_CONFIG_S3_PROVIDER: ${{ secrets.S3_PROVIDER }}
          RCLONE_CONFIG_S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          RCLONE_CONFIG_S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          RCLONE_CONFIG_S3_REGION: ${{ secrets.S3_REGION }}
          RCLONE_CONFIG_S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
          SOURCE_DIR: $(dirname "${{ steps.build.outputs.iso-dest }}")
        run: |
          sudo apt-get update
          sudo apt-get install -y rclone
          rclone copy $SOURCE_DIR S3:${{ secrets.S3_BUCKET_NAME }}

      - name: Prepare release
        id: prep
        shell: bash
        run: |
          TAG="${{ inputs.tag }}"
          SHA_SHORT=$(git rev-parse --short HEAD)
          echo "tag=${TAG}-${SHA_SHORT}" >> $GITHUB_OUTPUT
          echo "name=Bazzite-SDX $TAG" >> $GITHUB_OUTPUT

      - name: Create Release
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@01570d5c94564605e56de3056d071533d9637614 # v2
        with:
          tag_name: ${{ steps.prep.outputs.tag }}
          name: ${{ steps.prep.outputs.name }}
          body: |
            ### Bazzite-SDX ISO Release
            
            This ISO can be flashed to a USB drive and used to install Bazzite-SDX on Surface devices.
            
            **Contains:**
            - Linux Surface kernel 7.2.15-1.surface.fc45
            - iptsd, libwacom-surface, surface-control
            - Fedora 45 base with all Surface drivers
            
            **SHA256:** See attached checksum file
          files: ${{ steps.build.outputs.iso-dest }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
