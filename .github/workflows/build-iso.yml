--- 

name: Build Live ISO

on:
  workflow_dispatch:
    inputs:
      upload-to-s3:
        description: "Upload to S3"
        required: false
        default: false
        type: boolean
      platform:
        required: true
        type: choice
        options:
          - amd64
          - arm64

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write
  artifact-metadata: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build-iso:
    name: Build ISO
    runs-on: ${{ inputs.platform == 'amd64' && 'ubuntu-latest' || 'ubuntu-latest' }}
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write

    steps:
      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@ceedf095f4ec1a097402bc6bd80831f2e1a6fde6 # v2.0.0
        with:
          tool-cache: true

      - name: Mount Container Storage BTRFS Loopback
        run: |
          sudo truncate -s 110G /mnt/podman-storage.img
          sudo mkfs.btrfs -f -m single -d single /mnt/podman-storage.img
          sudo podman system reset --force
          sudo systemctl stop podman.service
          LOOP=$(sudo losetup --find --show --direct-io=on /mnt/podman-storage.img)
          sudo mkdir -p /mnt/podman-storage
          sudo mount -o compress-force=zstd:2,discard=async,noatime "$LOOP" /mnt/podman-storage
          sudo mkdir -p /mnt/podman-storage/storage /mnt/podman-storage/tmp
          sudo mount --bind /mnt/podman-storage/storage /var/lib/containers/storage
          sudo systemctl start podman.service

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Just
        uses: extractions/setup-just@e33e0265a09d6d736e2ee1e0eb685ef1de4669ff # v3

      - name: Build ISO
        id: build
        uses: Zeglius/titanoboa@revamp-pr
        with:
          image-ref: ghcr.io/nexgen-3d-printing/bazzite-sdx:latest
          iso-dest: bazzite-sdx-latest-amd64.iso

      - name: Generate SHA256 checksum
        shell: bash
        run: |
          cd $(dirname "${{ steps.build.outputs.iso-dest }}")
          sha256sum $(basename "${{ steps.build.outputs.iso-dest }}") > $(basename "${{ steps.build.outputs.iso-dest }}").sha256

      - name: Upload ISO artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          path: ${{ steps.build.outputs.iso-dest }}
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
          overwrite: true

      - name: Upload Checksum artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          path: ${{ steps.build.outputs.iso-dest }}.sha256
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
          overwrite: true
