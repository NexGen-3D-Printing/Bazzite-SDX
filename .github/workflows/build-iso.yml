name: Build Live ISO

on:
  workflow_dispatch:
    inputs:
      upload-to-s3:
        description: "Upload to S3"
        required: false
        default: false
        type: boolean
  workflow_run:
    workflows: ["Build container image"]
    types:
      - completed
  schedule:
    - cron: '0 6 * * 1'  # Weekly on Monday 06:00 UTC

env:
  IMAGE_NAME: ${{ github.event.repository.name }}
  IMAGE_REGISTRY: "ghcr.io/${{ github.repository_owner }}"
  IMAGE_TAG: "latest"

permissions:
  contents: read
  packages: read
  actions: read
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build-iso:
    name: Build ISO (amd64)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
      actions: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | podman login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Pull image for metadata
        run: |
          podman pull "${IMAGE_REGISTRY}/${IMAGE_NAME}:${IMAGE_TAG}"

      - name: Capture release metadata
        id: metadata
        run: |
          IMG="${IMAGE_REGISTRY}/${IMAGE_NAME}:${IMAGE_TAG}"
          SURFACE_KERNEL=$(podman run --rm "$IMG" rpm -q kernel-surface --qf '%{VERSION}-%{RELEASE}' 2>/dev/null || echo "unknown")
          BASE_PRETTY=$(podman run --rm "$IMG" bash -lc '. /usr/lib/os-release && echo "${PRETTY_NAME:-}"' 2>/dev/null || echo "unknown")
          BASE_VERSION=$(podman run --rm "$IMG" bash -lc '. /usr/lib/os-release && echo "${VERSION_ID:-${VERSION:-unknown}}"' 2>/dev/null || echo "unknown")
          IMAGE_VERSION=$(podman inspect "$IMG" --format '{{ index .Config.Labels "org.opencontainers.image.version" }}' 2>/dev/null || echo "")
          IMAGE_TITLE=$(podman inspect "$IMG" --format '{{ index .Config.Labels "org.opencontainers.image.title" }}' 2>/dev/null || echo "")
          cat > /tmp/release-metadata.json <<JSON
          {
            "surface_kernel": "${SURFACE_KERNEL}",
            "base_pretty_name": "${BASE_PRETTY}",
            "base_version": "${BASE_VERSION}",
            "image_version": "${IMAGE_VERSION}",
            "image_title": "${IMAGE_TITLE}",
            "build_date_utc": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          JSON
          cat /tmp/release-metadata.json

      - name: Upload metadata artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: bazzite-sdx-metadata
          path: /tmp/release-metadata.json
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
          overwrite: true

      - name: Build ISO with Titanoboa
        id: build
        uses: ublue-os/titanoboa@main
        with:
          image-ref: ${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          iso-dest: bazzite-sdx-latest-amd64.iso

      - name: Generate SHA256 checksum
        shell: bash
        run: |
          if [[ -f "${{ steps.build.outputs.iso-dest }}" ]]; then
            cd $(dirname "${{ steps.build.outputs.iso-dest }}")
            sha256sum $(basename "${{ steps.build.outputs.iso-dest }}") > $(basename "${{ steps.build.outputs.iso-dest }}").sha256
          fi

      - name: Upload ISO artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: bazzite-sdx-iso
          path: ${{ steps.build.outputs.iso-dest }}
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
          overwrite: true

      - name: Upload Checksum artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: bazzite-sdx-checksum
          path: ${{ steps.build.outputs.iso-dest }}.sha256
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
          overwrite: true
