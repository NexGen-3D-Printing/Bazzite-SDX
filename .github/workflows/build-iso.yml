name: Build Installer ISO

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Build container image"]
    types:
      - completed
  schedule:
    - cron: '0 6 * * 1'  # Weekly on Monday 06:00 UTC

env:
  IMAGE_NAME: ${{ github.event.repository.name }}
  IMAGE_REGISTRY: ghcr.io/${{ github.repository_owner }}
  IMAGE_TAG: latest
  ISO_NAME: bazzite-sdx-latest-amd64.iso

permissions:
  contents: read
  packages: read
  actions: read
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build-iso:
    name: Build ISO (amd64)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
      actions: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      - name: Maximize build space
        continue-on-error: true
        uses: ublue-os/remove-unwanted-software@cc0becac701cf642c8f0a6613bbdaf5dc36b259e # v9
        with:
          remove-codeql: true

      - name: Normalize image reference
        run: |
          IMAGE_REF="${IMAGE_REGISTRY,,}/${IMAGE_NAME,,}:${IMAGE_TAG}"
          echo "IMAGE_REF=${IMAGE_REF}" >> "$GITHUB_ENV"
          echo "Using ${IMAGE_REF}"

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | podman login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Pull image for metadata
        run: |
          podman pull "${IMAGE_REF}"

      - name: Capture release metadata
        run: |
          SURFACE_KERNEL=$(podman run --rm "${IMAGE_REF}" rpm -q kernel-surface --qf '%{VERSION}-%{RELEASE}' 2>/dev/null || echo "unknown")
          BASE_PRETTY=$(podman run --rm "${IMAGE_REF}" bash -lc '. /usr/lib/os-release && echo "${PRETTY_NAME:-}"' 2>/dev/null || echo "unknown")
          BASE_VERSION=$(podman run --rm "${IMAGE_REF}" bash -lc '. /usr/lib/os-release && echo "${VERSION_ID:-${VERSION:-unknown}}"' 2>/dev/null || echo "unknown")
          IMAGE_VERSION=$(podman inspect "${IMAGE_REF}" --format '{{ index .Config.Labels "org.opencontainers.image.version" }}' 2>/dev/null || echo "")
          IMAGE_TITLE=$(podman inspect "${IMAGE_REF}" --format '{{ index .Config.Labels "org.opencontainers.image.title" }}' 2>/dev/null || echo "")
          cat > /tmp/release-metadata.json <<JSON
          {
            "surface_kernel": "${SURFACE_KERNEL}",
            "base_pretty_name": "${BASE_PRETTY}",
            "base_version": "${BASE_VERSION}",
            "image_version": "${IMAGE_VERSION}",
            "image_title": "${IMAGE_TITLE}",
            "build_date_utc": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          JSON
          cat /tmp/release-metadata.json

      - name: Upload metadata artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bazzite-sdx-metadata
          path: /tmp/release-metadata.json
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
          overwrite: true

      - name: Build ISO
        id: build
        uses: ublue-os/bootc-image-builder-action@main
        with:
          bootc-image-builder-image: quay.io/centos-bootc/bootc-image-builder:latest
          use-librepo: true
          config-file: ./disk_config/iso.toml
          image: ${{ env.IMAGE_REF }}

      - name: Prepare ISO and checksum
        id: prepare
        run: |
          set -euo pipefail
          OUT_DIR="${{ steps.build.outputs.output-directory }}"
          echo "Output directory: ${OUT_DIR}"
          find "${OUT_DIR}" -maxdepth 3 -type f -print
          ISO_SRC=$(find "${OUT_DIR}" -type f -name '*.iso' | head -n1)
          if [ -z "${ISO_SRC}" ]; then
            echo "No ISO found in ${OUT_DIR}" >&2
            exit 1
          fi
          mkdir -p /tmp/iso-out
          cp "${ISO_SRC}" "/tmp/iso-out/${ISO_NAME}"
          (cd /tmp/iso-out && sha256sum "${ISO_NAME}" > "${ISO_NAME}.sha256")
          echo "iso_path=/tmp/iso-out/${ISO_NAME}" >> "$GITHUB_OUTPUT"
          echo "checksum_path=/tmp/iso-out/${ISO_NAME}.sha256" >> "$GITHUB_OUTPUT"

      - name: Upload ISO artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bazzite-sdx-iso
          path: ${{ steps.prepare.outputs.iso_path }}
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
          overwrite: true

      - name: Upload Checksum artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bazzite-sdx-checksum
          path: ${{ steps.prepare.outputs.checksum_path }}
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
          overwrite: true
