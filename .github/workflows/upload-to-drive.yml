name: Upload ISO to Google Drive and Publish Release

on:
  workflow_run:
    workflows: ["Build Live ISO"]
    types:
      - completed
  workflow_dispatch:
    inputs:
      run_id:
        description: "Build Live ISO run ID to download artifacts from (leave empty for latest successful run)"
        required: false
        type: string

permissions:
  contents: write
  actions: read

jobs:
  upload-and-release:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Find latest successful run (manual trigger)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_id == '' }}
        id: find-run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RUN_ID=$(gh run list --workflow build-iso.yml --branch main --status success --limit 1 --json databaseId -q '.[0].databaseId')
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"

      - name: Download ISO artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: bazzite-sdx-iso
          path: /tmp/iso
          run-id: ${{ github.event.workflow_run.id || inputs.run_id || steps.find-run.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download checksum artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: bazzite-sdx-checksum
          path: /tmp/checksum
          run-id: ${{ github.event.workflow_run.id || inputs.run_id || steps.find-run.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Locate files
        id: files
        run: |
          ISO_PATH=$(find /tmp/iso -name "*.iso" -type f | head -1)
          CHECKSUM_PATH=$(find /tmp/checksum -name "*.sha256" -type f | head -1)
          echo "iso_path=$ISO_PATH" >> "$GITHUB_OUTPUT"
          echo "iso_name=$(basename "$ISO_PATH")" >> "$GITHUB_OUTPUT"
          echo "checksum_path=$CHECKSUM_PATH" >> "$GITHUB_OUTPUT"

      - name: Upload ISO to Google Drive
        id: gdrive
        env:
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
          GOOGLE_DRIVE_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_FOLDER_ID }}
          ISO_PATH: ${{ steps.files.outputs.iso_path }}
          ISO_NAME: ${{ steps.files.outputs.iso_name }}
        run: |
          pip install google-api-python-client google-auth-httplib2 google-auth-oauthlib > /dev/null
          python3 .github/workflows/upload-to-drive.py

      - name: Create or update GitHub Release (latest)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DRIVE_LINK: ${{ steps.gdrive.outputs.drive_link }}
        run: |
          TAG="latest"
          TITLE="Bazzite-SDX Latest"
          NOTES="## Bazzite-SDX (Latest ISO)

          Automated latest ISO release for Bazzite-SDX.

          ### Features
          - Linux Surface kernel 7.2.15-1.surface.fc45
          - iptsd, libwacom-surface, surface-control
          - Fedora 44 base with Surface drivers

          ### Download
          - **ISO (Google Drive):** ${DRIVE_LINK}
          - **Checksum:** attached as a release asset (\`.sha256\`)

          > Note: The ISO is hosted on Google Drive due to GitHub Releases' 2 GB asset limit.

          ### Create a bootable USB installer
          - **Windows:** [Rufus](https://rufus.ie/) — select the ISO and write it to your USB drive.
          - **macOS / Linux:** [balenaEtcher](https://etcher.balena.io/) — select the ISO, select your USB drive, and flash.

          ### Rebase from Kinoite or standard Bazzite
          \`\`\`bash
          # Verify current state
          sudo bootc status

          # Rebase to Bazzite-SDX
          sudo bootc switch ghcr.io/nexgen-3d-printing/bazzite-sdx:latest

          # Verify the switch
          sudo bootc status

          # Pull and apply updates
          sudo bootc fetch --apply
          \`\`\`

          ### Security verification
          \`\`\`bash
          cosign verify --key cosign.pub ghcr.io/nexgen-3d-printing/bazzite-sdx:latest
          \`\`\`

          ### Related resources
          - **Bazzite-SDX repository:** https://github.com/NexGen-3D-Printing/bazzite-sdx
          - **Surface Linux kernel:** https://github.com/linux-surface/linux-surface"

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "$TITLE" --notes "$NOTES" --latest
          else
            gh release create "$TAG" --title "$TITLE" --notes "$NOTES" --latest
          fi

      - name: Upload checksum to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -n "${{ steps.files.outputs.checksum_path }}" ] && [ -f "${{ steps.files.outputs.checksum_path }}" ]; then
            gh release upload latest "${{ steps.files.outputs.checksum_path }}" --clobber
          fi
