name: Upload ISO to Google Drive

on:
  workflow_run:
    workflows: ["Build Live ISO"]
    types:
      - completed

permissions:
  contents: read
  actions: read

jobs:
  upload-to-drive:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Download artifact
        uses: actions/download-artifact@fa0a91e5b0e557e1b4ec7d9d77a531780b989638 # v2.1.0
        with:
          name: bazzite-sdx-iso
          path: /tmp/iso

      - name: Upload ISO to Google Drive
        env:
          GOOGLE_DRIVE_SERVICE_ACCOUNT_KEY: ${{ secrets.GOOGLE_DRIVE_SERVICE_ACCOUNT_KEY }}
          ISO_PATH: /tmp/iso/bazzite-sdx-latest-amd64.iso
          ISO_NAME: bazzite-sdx-latest-amd64.iso
        run: |
          pip install google-api-python-client google-auth-httplib2 google-auth-oauthlib > /dev/null
          python3 .github/workflows/upload-to-drive.py
