name: Publish ISO to GitHub Release

on:
  workflow_run:
    workflows: ["Build Live ISO"]
    types:
      - completed
  workflow_dispatch:
    inputs:
      run_id:
        description: "Build Live ISO run ID to download artifacts from (leave empty for latest successful run)"
        required: false
        type: string

permissions:
  contents: write
  actions: read

jobs:
  publish-release:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Find latest successful run (manual trigger)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_id == '' }}
        id: find-run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RUN_ID=$(gh run list --workflow build-iso.yml --branch main --status success --limit 1 --json databaseId -q '.[0].databaseId')
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"

      - name: Download ISO artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: bazzite-sdx-iso
          path: /tmp/iso
          run-id: ${{ github.event.workflow_run.id || inputs.run_id || steps.find-run.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download checksum artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: bazzite-sdx-checksum
          path: /tmp/checksum
          run-id: ${{ github.event.workflow_run.id || inputs.run_id || steps.find-run.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Locate files
        id: files
        run: |
          ISO_PATH=$(find /tmp/iso -name "*.iso" -type f | head -1)
          CHECKSUM_PATH=$(find /tmp/checksum -name "*.sha256" -type f | head -1)
          echo "iso_path=$ISO_PATH" >> "$GITHUB_OUTPUT"
          echo "iso_name=$(basename "$ISO_PATH")" >> "$GITHUB_OUTPUT"
          echo "checksum_path=$CHECKSUM_PATH" >> "$GITHUB_OUTPUT"

      - name: Create or update GitHub Release (latest)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="latest"
          TITLE="Bazzite-SDX Latest"
          NOTES="Automated latest ISO release for Bazzite-SDX.

- ISO and checksum attached as release assets
- Source: https://github.com/NexGen-3D-Printing/bazzite-sdx
- Surface Linux kernel: https://github.com/linux-surface/linux-surface"

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "$TITLE" --notes "$NOTES" --latest
          else
            gh release create "$TAG" --title "$TITLE" --notes "$NOTES" --latest
          fi

      - name: Upload assets to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload latest "${{ steps.files.outputs.iso_path }}" --clobber
          if [ -n "${{ steps.files.outputs.checksum_path }}" ] && [ -f "${{ steps.files.outputs.checksum_path }}" ]; then
            gh release upload latest "${{ steps.files.outputs.checksum_path }}" --clobber
          fi
