name: Upload ISO to Google Drive

on:
  workflow_run:
    workflows: ["Build Live ISO"]
    types:
      - completed
  workflow_dispatch:
    inputs:
      run_id:
        description: "Build Live ISO run ID to download artifacts from (leave empty for latest successful run)"
        required: false
        type: string

permissions:
  contents: read
  actions: read

jobs:
  upload-to-drive:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Find latest successful run (manual trigger)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_id == '' }}
        id: find-run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RUN_ID=$(gh run list --workflow build-iso.yml --branch main --status success --limit 1 --json databaseId -q '.[0].databaseId')
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"

      - name: Download artifact
        uses: actions/download-artifact@fa0a91e5b0e557e1b4ec7d9d77a531780b989638 # v4.1.8
        with:
          name: bazzite-sdx-iso
          path: /tmp/iso
          run-id: ${{ github.event.workflow_run.id || inputs.run_id || steps.find-run.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload ISO to Google Drive
        env:
          GOOGLE_DRIVE_SERVICE_ACCOUNT_KEY: ${{ secrets.GOOGLE_DRIVE_SERVICE_ACCOUNT_KEY }}
          ISO_PATH: /tmp/iso/bazzite-sdx-latest-amd64.iso
          ISO_NAME: bazzite-sdx-latest-amd64.iso
        run: |
          pip install google-api-python-client google-auth-httplib2 google-auth-oauthlib > /dev/null
          python3 .github/workflows/upload-to-drive.py
