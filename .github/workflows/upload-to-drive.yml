name: Upload ISO to Google Drive and Publish Release

on:
  workflow_run:
    workflows: ["Build Installer ISO"]
    types:
      - completed
  workflow_dispatch:
    inputs:
      run_id:
        description: "Build Installer ISO run ID to download artifacts from (leave empty for latest successful run)"
        required: false
        type: string

permissions:
  contents: write
  actions: read

jobs:
  upload-and-release:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0

      - name: Find latest successful run (manual trigger)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_id == '' }}
        id: find-run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RUN_ID=$(gh run list --workflow build-iso.yml --branch main --status success --limit 1 --json databaseId -q '.[0].databaseId')
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"

      - name: Download ISO artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: bazzite-sdx-iso
          path: /tmp/iso
          run-id: ${{ github.event.workflow_run.id || inputs.run_id || steps.find-run.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download checksum artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: bazzite-sdx-checksum
          path: /tmp/checksum
          run-id: ${{ github.event.workflow_run.id || inputs.run_id || steps.find-run.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download metadata artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: bazzite-sdx-metadata
          path: /tmp/metadata
          run-id: ${{ github.event.workflow_run.id || inputs.run_id || steps.find-run.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: Locate files
        id: files
        run: |
          ISO_PATH=$(find /tmp/iso -name "*.iso" -type f | head -1)
          CHECKSUM_PATH=$(find /tmp/checksum -name "*.sha256" -type f | head -1)
          echo "iso_path=$ISO_PATH" >> "$GITHUB_OUTPUT"
          echo "iso_name=$(basename "$ISO_PATH")" >> "$GITHUB_OUTPUT"
          echo "checksum_path=$CHECKSUM_PATH" >> "$GITHUB_OUTPUT"

      - name: Upload ISO to Google Drive
        id: gdrive
        env:
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
          GOOGLE_DRIVE_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_FOLDER_ID }}
          ISO_PATH: ${{ steps.files.outputs.iso_path }}
          ISO_NAME: ${{ steps.files.outputs.iso_name }}
        run: |
          pip install google-api-python-client google-auth-httplib2 google-auth-oauthlib > /dev/null
          python3 .github/workflows/upload-to-drive.py

      - name: Prepare release notes
        id: notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DRIVE_LINK: ${{ steps.gdrive.outputs.drive_link }}
        run: |
          set -euo pipefail

          # Metadata (from build-iso artifact)
          SURFACE_KERNEL="unknown"
          BASE_PRETTY="unknown"
          BASE_VERSION="unknown"
          IMAGE_VERSION="latest"
          if [ -f /tmp/metadata/release-metadata.json ]; then
            SURFACE_KERNEL=$(jq -r '.surface_kernel // "unknown"' /tmp/metadata/release-metadata.json)
            BASE_PRETTY=$(jq -r '.base_pretty_name // "unknown"' /tmp/metadata/release-metadata.json)
            BASE_VERSION=$(jq -r '.base_version // "unknown"' /tmp/metadata/release-metadata.json)
            IMAGE_VERSION=$(jq -r '.image_version // "latest"' /tmp/metadata/release-metadata.json)
          fi

          # Previous release info (before updating latest)
          PREV_PUBLISHED=""
          if gh release view latest --json publishedAt >/tmp/prev-release.json 2>/dev/null; then
            PREV_PUBLISHED=$(jq -r '.publishedAt // ""' /tmp/prev-release.json)
          fi

          # Changes since last release
          CHANGES=""
          if [ -n "$PREV_PUBLISHED" ]; then
            CHANGES=$(git log --since="$PREV_PUBLISHED" --no-merges --pretty=format:'- %s (%h)' --max-count=30 2>/dev/null || true)
          fi
          if [ -z "$CHANGES" ]; then
            CHANGES=$(git log -n 10 --no-merges --pretty=format:'- %s (%h)' 2>/dev/null || true)
          fi
          if [ -z "$CHANGES" ]; then
            CHANGES="- No commit history available"
          fi

          # Write notes to file to avoid shell escaping issues
          {
            echo "## Bazzite-SDX (Latest ISO)"
            echo ""
            echo "Automated latest ISO release for Bazzite-SDX."
            echo ""
            echo "### Versions"
            echo "- **Surface kernel:** ${SURFACE_KERNEL}"
            echo "- **Base system (Bazzite-DX):** ${BASE_PRETTY} (${BASE_VERSION})"
            echo "- **Image tag/version:** ${IMAGE_VERSION}"
            echo ""
            echo "### Download"
            echo "- **ISO (Google Drive):** ${DRIVE_LINK}"
            echo "- **Checksum:** attached as a release asset (\`.sha256\`)"
            echo ""
            echo "> Note: The ISO is hosted on Google Drive due to GitHub Releases' 2 GB asset limit."
            echo ""
            echo "### Major changes since last release"
            echo "${CHANGES}"
            echo ""
            echo "### Create a bootable USB installer"
            echo "- **Windows:** [Rufus](https://rufus.ie/) — select the ISO and write it to your USB drive."
            echo "- **macOS / Linux:** [balenaEtcher](https://etcher.balena.io/) — select the ISO, select your USB drive, and flash."
            echo ""
            echo "### Rebase from Kinoite, Bazzite, or Bazzite-DX"
            echo '```bash'
            echo "# Verify current state"
            echo "sudo bootc status"
            echo ""
            echo "# Rebase to Bazzite-SDX (based on Bazzite-DX)"
            echo "sudo bootc switch ghcr.io/nexgen-3d-printing/bazzite-sdx:latest"
            echo ""
            echo "# Verify the switch"
            echo "sudo bootc status"
            echo ""
            echo "# Pull and apply updates"
            echo "sudo bootc fetch --apply"
            echo '```'
            echo ""
            echo "### Security verification"
            echo '```bash'
            echo "cosign verify --key cosign.pub ghcr.io/nexgen-3d-printing/bazzite-sdx:latest"
            echo '```'
            echo ""
            echo "### Related resources"
            echo "- **Bazzite-SDX repository:** https://github.com/NexGen-3D-Printing/bazzite-sdx"
            echo "- **Surface Linux kernel:** https://github.com/linux-surface/linux-surface"
          } > /tmp/release-notes.md

          echo "notes_file=/tmp/release-notes.md" >> "$GITHUB_OUTPUT"

      - name: Create or update GitHub Release (latest)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="latest"
          TITLE="Bazzite-SDX Latest"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "$TITLE" --notes-file /tmp/release-notes.md --latest
          else
            gh release create "$TAG" --title "$TITLE" --notes-file /tmp/release-notes.md --latest
          fi

      - name: Upload checksum to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -n "${{ steps.files.outputs.checksum_path }}" ] && [ -f "${{ steps.files.outputs.checksum_path }}" ]; then
            gh release upload latest "${{ steps.files.outputs.checksum_path }}" --clobber
          fi
